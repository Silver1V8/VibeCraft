[project]
name = "rag"
version = "0.1.0"
description = "Console Graph-RAG: indicizzazione (core/indexing), retrieval ibrido governato e pipeline Explore->Canvas->Propose (core/) esposti via FastAPI (api/). Entrypoint: server.py, index.py."
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk==0.2.130",
    "fastapi==0.141.1",
    "flagembedding>=1.4.0",
    "h2==4.4.1",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "markdownify>=1.2.3",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]==0.1.7",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client==1.19.0",
    "torch",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-language-pack==1.14.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
