[project]
name = "rag"
version = "0.1.0"
description = "Console Graph-RAG: indicizzazione (core/indexing), retrieval ibrido governato e pipeline Explore->Canvas->Propose (core/) esposti via FastAPI (api/). Entrypoint: server.py, index.py."
authors = [{ name = "Valerio Silvestre", email = "silvestre.valerio@gmail.com" }]
# SPDX. Il file sta nella root del repository (../LICENSE), fuori da questa directory di
# progetto: NON è dichiarato in `license-files` perché quel campo non accetta percorsi
# esterni alla root del progetto, e qui non servirebbe comunque — vibecraft è
# un'applicazione che si esegue dal sorgente, non un pacchetto che si costruisce.
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk==0.2.144",
    "fastapi==0.141.1",
    "flagembedding==1.4.2",
    "h2==4.4.1",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "markdownify>=1.2.3",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]==0.1.7",
    "networkx>=3.6.1",
    "numpy==2.5.2",
    # Lettori di documenti di core/chunking.read_document. Dichiarate ENTRAMBE:
    # pypdf non c'era (i PDF venivano indicizzati vuoti, vedi AUDIT A19) e openpyxl
    # arrivava solo come transitiva di markitdown, cioe' funzionava per fortuna.
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pypdf>=6.1.3",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client==1.19.0",
    "torch",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-language-pack==1.15.8",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Fabbrica il PDF finto di tests/test_intake_convert.py. Esplicita e non
    # transitiva (arriva anche da pdfplumber) perche' un test la importa
    # direttamente. Sostituisce pymupdf, che e' AGPL-3.0.
    "pypdfium2>=5.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
