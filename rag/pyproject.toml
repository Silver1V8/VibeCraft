[project]
name = "rag"
version = "0.1.0"
description = "Console HARO Graph-RAG: indicizzazione (core/indexing), retrieval ibrido governato e pipeline Explore->Canvas->Propose (core/) esposti via FastAPI (api/). Entrypoint: server.py, index.py."
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.115",
    "fastapi>=0.139.0",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
