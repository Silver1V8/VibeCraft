[project]
name = "rag"
version = "0.1.0"
description = "Console Graph-RAG: indicizzazione (core/indexing), retrieval ibrido governato e pipeline Explore->Canvas->Propose (core/) esposti via FastAPI (api/). Entrypoint: server.py, index.py."
authors = [{ name = "Valerio Silvestre", email = "silvestre.valerio@gmail.com" }]
# SPDX. Il file sta nella root del repository (../LICENSE), fuori da questa directory di
# progetto: NON è dichiarato in `license-files` perché quel campo non accetta percorsi
# esterni alla root del progetto, e qui non servirebbe comunque — vibecraft è
# un'applicazione che si esegue dal sorgente, non un pacchetto che si costruisce.
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk==0.2.144",
    # Conversione dell'intake (core/intake_convert.py), SENZA l'extra [vlm]: niente Granite
    # e niente binari GPL di `av`. Il pin di docling non pinna la catena (docling-parse si è
    # già mosso sotto un pin fermo, EVOLUZIONE.md): la famiglia è fissata alle versioni
    # verificate dal pilot. torchvision arriva da PyPI (build CPU su Windows): Docling gira
    # su CPU esplicita, vedi rag/adr/NOTA_IMPLEMENTAZIONE_MIGLIORIE.md.
    "docling==2.126.0",
    "docling-core==2.95.0",
    "docling-ibm-models==4.0.2",
    "docling-parse==7.18.0",
    "fastapi==0.141.1",
    "flagembedding==1.4.2",
    "h2==4.4.1",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "markdownify>=1.2.3",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]==0.1.7",
    "mcp==2.1.0",
    "networkx>=3.6.1",
    "numpy==2.5.2",
    # Lettori di documenti di core/chunking.read_document. Dichiarate ENTRAMBE:
    # pypdf non c'era (i PDF venivano indicizzati vuoti, vedi AUDIT A19) e openpyxl
    # arrivava solo come transitiva di markitdown, cioe' funzionava per fortuna.
    "openpyxl>=3.1.5",
    # Lettura diretta degli XLS nell'intake (core/intake_excel.py): prima arrivava solo come
    # transitiva di markitdown[xls]. Importata dall'app, quindi dichiarata qui.
    "xlrd>=2.0.2",
    "pydantic>=2.13.4",
    "pypdf>=6.1.3",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client==1.19.0",
    # PINNATA di proposito. Con l'indice CUDA ristretto per piattaforma (tool.uv.sources)
    # torch arriva da DUE registri: cu126 su linux/win-amd64, PyPI altrove. Senza pin uv
    # risolve ogni ramo per conto suo e macOS finiva su 2.14.0 mentre tutti gli altri
    # stavano su 2.13.0 — la stessa deriva di versione che il Dockerfile documenta di aver
    # gia' subito una volta. Verificato che PyPI abbia la wheel corrispondente
    # (torch-2.13.0-cp314-cp314-macosx_14_0_arm64.whl), altrimenti il pin sposterebbe solo
    # il problema. Da tenere allineata al `uv pip install torch==...` del target cpu.
    "torch==2.13.0",
    # DIRETTA di proposito, benché la usi solo Docling: [tool.uv.sources] vale soltanto per
    # le dipendenze dirette, e torchvision deve seguire l'indice di torch (vedi sotto).
    # Pinnata alla versione compilata per torch 2.13.0.
    "torchvision==0.28.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-language-pack==1.15.8",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    # Fabbrica il PDF finto di tests/test_intake_convert.py. Esplicita e non
    # transitiva (arriva anche da pdfplumber) perche' un test la importa
    # direttamente. Sostituisce pymupdf, che e' AGPL-3.0.
    "pypdfium2>=5.13.0",
    "ruff>=0.16.5",
]

[tool.uv.sources]
# L'indice CUDA vale SOLO dove le sue wheel esistono davvero. Il marcatore non è
# difensivo: è la trascrizione dell'elenco di wheel che uv.lock contiene per
# torch 2.13.0+cu126 — `manylinux_2_28_{x86_64,aarch64}` e `win_amd64`, nient'altro.
# Senza di esso `uv sync` FALLISCE su macOS (Intel e ARM) e su Windows ARM con
# "doesn't have a source distribution or wheel for the current platform": misurato
# con `uv sync --frozen --dry-run --python-platform <p>` su sei piattaforme (A15).
# Lì torch arriva da PyPI, che quelle wheel le ha.
#
# NON risolve la macchina CPU-only x86_64: quella sincronizza già oggi (la build CUDA
# si installa e gira su CPU, con torch.cuda.is_available() = False), solo pesante —
# per lei esiste il target `cpu` del Dockerfile. Scegliere CPU-vs-CUDA sulla STESSA
# piattaforma richiederebbe extra in conflitto (`uv sync --extra cpu`), cioè cambiare
# il comando di installazione per tutti: fuori da questo riscontro.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]
# torchvision (arriva con Docling) DEVE venire dallo stesso indice di torch, con lo stesso
# marcatore. Da PyPI arriverebbe `0.28.0+cu130` su Linux accanto a torch `+cu126`: al primo
# import torchvision confronta i major CUDA e solleva RuntimeError (12 != 13). Su Windows
# arriverebbe `+cpu`, con le operazioni compilate (nms) assenti sul backend CUDA mentre
# torch.cuda.is_available() resta True. cu126 pubblica 0.28.0 per linux x86_64/aarch64 e
# win_amd64, cioè esattamente le piattaforme del marcatore; altrove PyPI, come torch.
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Selezione ESPLICITA (A9), non il default del tool: il default di ruff 0.16 include
# famiglie di regole di stile discrezionale (SIM, PIE, YTT, ...) — 380 riscontri su
# questo codebase mai linterato, quasi tutte preferenze di scrittura, non difetti.
# Fissare la selezione qui protegge anche da un futuro bump di ruff che cambi
# silenziosamente cosa il gate CI applica.
#
#   E4/E7/E9 — pycodestyle: import fuori ordine, sintassi ambigua (nomi come `l`),
#              errori di sintassi. F — pyflakes: import inutilizzati, variabili morte,
#              f-string senza placeholder. Segnali di correttezza o leggibilità reale,
#              non gusto — è la stessa soglia con cui questo audit ha già chiuso ogni
#              altro riscontro: verificabile, non opinabile.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 (import non in cima al file) è qui DELIBERATO, non debito: entrambi i file
# devono forzare l'encoding UTF-8 di stdout/stderr — e index.py chiamare
# setup_logging() — PRIMA di qualunque import applicativo che possa loggare o
# stampare, altrimenti su Windows un log con accenti va in crash (server.py) o
# setup_logging() arriva dopo i moduli che l'hanno già letta (index.py). Riordinare
# per compiacere il linter romperebbe esattamente la garanzia che il commento in
# ciascun file spiega.
"server.py" = ["E402"]
"index.py" = ["E402"]
