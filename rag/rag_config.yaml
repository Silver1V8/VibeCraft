# rag_config.yaml
# Configurazione globale del sistema HARO Graph-RAG

llm_settings:
  # Valori supportati: "anthropic" (Claude 3.5 Sonnet), "openai" (GPT-4o), "ollama" (locale)
  #active_provider: "anthropic"
  active_provider: "ollama"
  
  # Modelli specifici per provider
  models:
    anthropic: "claude-sonnet-5"
    openai: "gpt-4o"
    ollama: "qwen3.5:9b" # generazione recente, 6.6GB: sta interamente negli 8GB di VRAM di una 3070 Ti

  # Thinking dei modelli Ollama che lo supportano (qwen3.5). false = disattivato: la pipeline
  # vuole risposte deterministiche e complete, e col thinking attivo il modello spende
  # centinaia di token a ragionare (anche ~270 per un "OK") e a volte esaurisce la
  # generazione nel ragionamento restituendo una RISPOSTA VUOTA — un canvas vuoto è un
  # fallimento silenzioso. Omesso/null = non inviare il parametro (per modelli che non
  # supportano il campo `think`).
  ollama_think: false

  # Finestra di contesto richiesta a Ollama (options.num_ctx). SENZA, il default è 4096
  # token e Ollama TRONCA SILENZIOSAMENTE il prompt dall'alto: i prompt di canvas/propose
  # superano i 4.300 token, quindi il modello non vedeva l'inizio — cioè l'intervista, il
  # soggetto della feature — e derivava sul contesto normativo; e la risposta, che divide
  # la stessa finestra, usciva mozzata (canvas con 4 sezioni su 7, troncato a metà frase).
  # 16384 copre i prompt attuali con margine; alzarlo aumenta la VRAM del KV cache.
  # Omesso/null = non inviare il parametro (default di Ollama).
  ollama_num_ctx: 16384

  # Override opzionale provider/modello PER SINGOLO STEP della pipeline (core/llm.py).
  # Scopi riconosciuti: drift, canvas, propose, validate, explore, review, ask.
  # Ogni chiave può indicare provider e/o model; ciò che manca ricade su
  # active_provider / models. Esempio: canvas su Claude, il resto su Ollama.
  #
  # Tutti gli step su qwen3.5:9b (vedi models.ollama): generazione più recente di qwen2.5 e
  # interamente in VRAM su una 3070 Ti — batte il vecchio 14B (che sborderebbe su CPU) sia in
  # qualità sia in velocità. qwen2.5:7b "annegava" le istruzioni articolate di canvas/propose
  # (stack che spariva, soggetto derivato al documento tecnico). Per differenziare di nuovo
  # per step (es. un modello più grosso solo per canvas/propose) riattiva `purposes`:
  #purposes:
  #  canvas:
  #    model: "qwen3.5:27b"
  #  propose:
  #    model: "qwen3.5:27b"

vector_database:
  provider: "qdrant"
  collection_name: "vibecraft_events"
  embedding_model: "BAAI/bge-m3" # Modello locale per vettori densi/sparsi

# Contesto governato che àncora Canvas/Propose (core/retrieval.py, api/routes_pipeline.py).
# Il retrieval è a DUE rami: uno di dominio (cosa deve fare la feature) e uno tecnico
# (con quale stack/pattern si implementa, in base al dev_type scelto). Servono due query
# perché una domanda di dominio ("form eventi") non è semanticamente vicina a una spec
# tecnologica ("stack, struttura cartelle"): con una sola query le seconde non risalgono
# mai. Entrambi i rami sono ricerche semantiche sull'intero indice: nessun filtro su path
# o cartelle, nessun documento forzato: cambia la domanda, non il ranking.
retrieval:
  governed_max_chunks: 8   # sezioni del ramo di dominio (normativo/business)
  tech_max_chunks: 3       # sezioni del ramo tecnico; 0 disattiva il ramo

  # Codice implementante iniettato nel contesto di /ask (api/routes_retrieval.py): dopo il
  # retrieval dei documenti si risalgono gli archi IMPLEMENTS entranti (codice -> sezione,
  # calcolati all'indicizzazione per similarità densa) e si iniettano gli snippet dei simboli
  # più fortemente linkati. Così l'LLM vede la spec E la sua implementazione reale e può
  # rispondere a domande comparative ("cosa manca nel form?") invece di fermarsi ai soli
  # documenti normativi. Il grafo indicizza il codice ma la ricerca semantica interroga solo
  # Qdrant (documenti): questo è il ponte codice->risposta. Le ancore non sono solo le sezioni
  # recuperate ma l'intera vicinanza BFS del grafo (stessa espansione della Mappa del Grafo),
  # così emerge anche il codice collegato ai documenti vicini, non solo a quelli che hanno
  # matchato la query — recall più alta a parità di query.
  code_context_max_snippets: 10  # tetto sugli snippet di codice iniettati (0 = disattiva del tutto)
  code_context_min_weight: 0.5   # soglia sul peso dell'arco IMPLEMENTS (cosine); >= soglia di linking (0.45)

  # Domanda del ramo tecnico. `{dev_type}` è sostituito con l'ambito scelto (una sottocartella
  # di code/), reso a parole: 'logicAgent' -> 'logic agent'. È una QUERY SEMANTICA, non un
  # filtro: recupera ciò che le somiglia, ovunque stia nell'alberatura. Riscrivila col
  # vocabolario e nella lingua dei TUOI documenti — è l'unico punto da adattare per portare
  # la pipeline su un progetto con una tassonomia diversa. Vuota (o tech_max_chunks: 0)
  # disattiva del tutto il ramo tecnico.
  tech_query: "specifica tecnologica {dev_type}: stack tecnologico, linguaggi e framework, pattern architetturali e struttura delle cartelle del progetto {dev_type}"

  # Campo del frontmatter in cui un documento DICHIARA a quale ambito appartiene: il ramo
  # tecnico considera solo i documenti che vi elencano il dev_type scelto (in una qualsiasi
  # grafia: 'logicAgent' trova 'logic-agent', 'logic_agent', 'logicagent'). Non è un
  # force-include di file noti — è il documento che si dichiara, e chiunque si dichiari
  # tale compete alla pari; serve perché spec tecnologiche di ambiti diversi sono quasi
  # gemelle e la sola somiglianza semantica non le separa.
  # Vuoto = nessuno scoping: il ramo tecnico cerca su tutto l'indice (e può pescare la
  # spec dell'ambito sbagliato). Se i tuoi documenti dichiarano l'ambito sotto un'altra
  # chiave, scrivila qui.
  tech_scope_tag_key: "tags"

# Ri-ponderazione per autorità nel retrieval (core/retrieval.py): i pesi per classe di
# documento modulano il ranking finale (fonti normative > informative; archiviate < attive).
# I valori qui sono i default calibrati a mano; ricalibrabili sul golden set con
# `eval/calibrate_authority.py` — usando SEMPRE uno split di validazione per non fare overfit.
authority:
  class_weights:
    IRON_MEMORY: 1.0
    AUTHORIZATION_POLICY: 0.9
    DATA_DICTIONARY: 0.7
    METHODOLOGY: 0.5
  default_weight: 0.7       # peso delle classi non elencate (es. REQUIREMENTS/spec) — CALIBRATO 2026-07-14 (era 0.4)
  archived_decay: 0.3       # moltiplicatore del peso per status ARCHIVED/DEPRECATED/HISTORICAL/OBSOLETE
  boost_alpha: 0.1          # forza del boost di autorità: mult = (1 - alpha) + alpha * peso  (alpha=0 → autorità ignorata) — CALIBRATO 2026-07-14 (era 0.4)
  # Calibrazione (eval/calibrate_authority.py, 5-fold CV su golden set 34 casi, 2026-07-14):
  # default_weight 0.4→0.7 e boost_alpha 0.4→0.1 alzano recall@10 held-out da 0.914 a 0.971 (+5.7%).
  # Il boost di autorità hand-set era troppo forte: sovra-promuoveva i safeguard IRON_MEMORY generici
  # rispetto alle spec REQUIREMENTS specifiche attese. Ricalibrare SEMPRE con split di validazione.

# Eval-gate continuo (core/eval_gate.py): prima di promuovere una nuova versione dell'indice
# (blue/green), misura la recall del retrieval sul golden set. Se scende sotto la soglia, blocca
# la promozione (CURRENT resta sull'ultima versione buona) e scrive un alert critico. Fail-open:
# se il golden set manca o il gate è disattivo, la promozione procede (non blocca i primi build).
eval_gate:
  enabled: true
  k: 10                # soglia di recall valutata (recall@k)
  min_recall: 0.90     # promozione bloccata se recall@k medio scende sotto questo valore
  blocking: true       # true = blocca la promozione; false = solo alert (advisory), promuove comunque
  # M6 — ESPERIMENTO: valutazione ADVISORY post-promozione sui job INCREMENTALI.
  # A flag attivo, DOPO la promozione di un incrementale si misura la recall sul golden set
  # contro lo stato appena promosso (stesso modello e client del job). Solo osservazione:
  # la promozione è già avvenuta e resta valida; sotto min_recall si scrive un alert WARNING
  # (mai critical, mai bloccante). Esito storicizzato in eval/results/history.jsonl con
  # source="incremental_advisory"; durata in advisory_eval_seconds dentro le stats del job
  # (→ campo result nel journal database/reindex_jobs.jsonl).
  # REGOLA DI DECISIONE DELL'ESPERIMENTO (nessuna terza opzione):
  #   1. attivare il flag MANUALMENTE per 2 settimane di lavoro reale;
  #   2. TENERE il gate se: mediana di advisory_eval_seconds ≤ 10% della durata mediana
  #      dei job incrementali (dal journal reindex_jobs.jsonl) E ≤ 1 alert/settimana a
  #      corpus stabile (database/alerts.jsonl, level=warning + advisory=incremental);
  #   3. RIMUOVERE flag e codice (mini-PR di revert) altrimenti.
  # ATTIVATO 2026-07-21 — verifica dovuta il 2026-08-04 (comandi di misura nel report M6,
  # branch feat/m6-incremental-advisory-gate / memoria versione-definitiva-plan).
  incremental_advisory: true

paths:
  docs_dir: "./docs"
  codebase_dir: "./code"

# Implementazione del parser simboli per linguaggio (code_index).
# Valori: "treesitter" (default, migrazione completata) | "regex" (fallback
# d'emergenza, storica). Python usa sempre stdlib ast e non ha flag.
code_parsers:
  typescript: "treesitter"
  javascript: "treesitter"
  svelte: "treesitter"
  # Java: unica implementazione (tree-sitter, nessun fallback regex). Copre anche
  # gli artefatti di progetto: pom.xml / build.gradle (dipendenze -> DEPENDS_ON)
  # e Kogito .bpmn/.bpmn2/.dmn (processi/decisioni). Estensioni registrate nel
  # dispatch di code_index/: .java, .bpmn, .bpmn2, .dmn + pom.xml/build.gradle.
  java: "treesitter"
  # C#/.NET: unica implementazione (tree-sitter-c-sharp dal language-pack),
  # runtime-agnostica (Framework e Core/5+). Copre anche .csproj
  # (PackageReference/ProjectReference -> DEPENDS_ON) e packages.config legacy.
  # Estensioni registrate nel dispatch di code_index/: .cs, .csproj + packages.config.
  csharp: "treesitter"
  # Razor (.cshtml/.razor): scanner ibrido dedicato (niente grammatica tree-sitter,
  # immatura): direttive/markup via scanner, blocchi @code via parser C#. Dialetti:
  # .razor=componente Blazor, .cshtml con @page=Razor Page, senza @page=view MVC.
  razor: "hybrid"
  # SQL (.sql, .pks/.pkb PL/SQL): ibrido tree-sitter-sql + scanner regex per i
  # dialetti (la grammatica non regge il procedurale). Archi semantici:
  # READS/WRITES/EXECUTES. sql_dialect = dialetto predefinito del repo quando
  # l'euristica sul contenuto non decide: tsql | plsql | generic.
  sql: "hybrid"
  sql_dialect: "generic"
  # Script operazionali (.sh Bash, .ps1/.psm1 PowerShell): entrambi tree-sitter
  # (grammatica PowerShell del language-pack verificata matura). Nodi script/
  # function, archi EXECUTES script->script e verso progetti/file invocati.
  shell: "treesitter"
  # Pipeline CI/CD riconosciute per NOME (pyyaml): GitLab CI e Azure DevOps.
  # Gli altri .yml (rag_config, application*.yml, ...) restano esclusi;
  # docker-compose/compose hanno il proprio parser (docker_patterns).
  ci_patterns:
    - ".gitlab-ci.yml"
    - "*.gitlab-ci.yml"
    - "*.gitlab-ci.yaml"
    - "azure-pipelines.yml"
    - "azure-pipelines*.yml"
    - "azure-pipelines*.yaml"
  # File di configurazione indicizzati per NOME (stdlib XML/JSON, secret sempre
  # mascherati): web/app.config + trasformazioni, appsettings*.json, package.json,
  # WSDL/XSD. Pattern fnmatch sovrascrivibili qui; gli altri .json/.xml restano
  # esclusi (dati, non struttura).
  config_patterns:
    - "web.config"
    - "app.config"
    - "web.*.config"
    - "app.*.config"
    - "appsettings.json"
    - "appsettings.*.json"
    - "package.json"
    - "*.wsdl"
    - "*.xsd"
    - "application.properties"
    - "application-*.properties"
    - "application.yml"
    - "application.yaml"
    - "application-*.yml"
    - "application-*.yaml"
  # Artefatti Docker riconosciuti per NOME (pyyaml per il compose, scanner
  # riga-per-riga per il Dockerfile): docker-compose/compose *.yml -> nodi
  # service (immagine, porte, depends_on -> DEPENDS_ON, build -> Dockerfile);
  # Dockerfile -> nodo image (immagini base, stage, EXPOSE). Secret mascherati.
  docker_patterns:
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "docker-compose.*.yml"
    - "docker-compose.*.yaml"
    - "compose.yml"
    - "compose.yaml"
    - "compose.*.yml"
    - "compose.*.yaml"
    - "dockerfile"
    - "dockerfile.*"
    - "*.dockerfile"
