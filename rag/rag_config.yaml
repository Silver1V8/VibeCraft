# rag_config.yaml
# Configurazione globale del sistema Graph-RAG

llm_settings:
  # Valori supportati: "anthropic" (Claude 3.5 Sonnet), "openai" (GPT-4o), "ollama" (locale)
  #active_provider: "anthropic"
  active_provider: "ollama"
  
  # Modelli specifici per provider
  models:
    anthropic: "claude-sonnet-5"
    openai: "gpt-4o"
    ollama: "qwen3.5:9b" # generazione recente, 6.6GB: sta interamente negli 8GB di VRAM di una 3070 Ti

  # Thinking dei modelli Ollama che lo supportano (qwen3.5). false = disattivato: la pipeline
  # vuole risposte deterministiche e complete, e col thinking attivo il modello spende
  # centinaia di token a ragionare (anche ~270 per un "OK") e a volte esaurisce la
  # generazione nel ragionamento restituendo una RISPOSTA VUOTA — un canvas vuoto è un
  # fallimento silenzioso. Omesso/null = non inviare il parametro (per modelli che non
  # supportano il campo `think`).
  ollama_think: false

  # Finestra di contesto richiesta a Ollama (options.num_ctx). SENZA, il default è 4096
  # token e Ollama TRONCA SILENZIOSAMENTE il prompt dall'alto: i prompt di canvas/propose
  # superano i 4.300 token, quindi il modello non vedeva l'inizio — cioè l'intervista, il
  # soggetto della feature — e derivava sul contesto normativo; e la risposta, che divide
  # la stessa finestra, usciva mozzata (canvas con 4 sezioni su 7, troncato a metà frase).
  # 16384 copre i prompt attuali con margine; alzarlo aumenta la VRAM del KV cache.
  # Omesso/null = non inviare il parametro (default di Ollama).
  ollama_num_ctx: 16384

  # Temperatura di campionamento (options.temperature). SENZA, Ollama campiona a 0.8: va bene
  # per la prosa, non per gli step che devono rispettare un formato. Sullo step propose
  # (spec.md, scenari GIVEN/WHEN/THEN in blocchi gherkin) a 0.8 lo stesso identico prompt
  # produceva a ogni run una violazione DIVERSA — un blocco unico invece di uno per scenario,
  # keyword italiane al posto di GIVEN/WHEN/THEN, scenari troncati prima del THEN — e nessuna
  # istruzione aggiuntiva nel prompt la eliminava, perché il problema era la varianza, non
  # l'ambiguità. Omesso/null = non inviare il parametro (default di Ollama).
  ollama_temperature: 0.1

  # Override opzionale provider/modello PER SINGOLO STEP della pipeline (core/llm.py).
  # Scopi riconosciuti: drift, canvas, propose, validate, explore, review, ask.
  # Ogni chiave può indicare provider e/o model; ciò che manca ricade su
  # active_provider / models. Esempio: canvas su Claude, il resto su Ollama.
  #
  # Tutti gli step su qwen3.5:9b (vedi models.ollama): generazione più recente di qwen2.5 e
  # interamente in VRAM su una 3070 Ti — batte il vecchio 14B (che sborderebbe su CPU) sia in
  # qualità sia in velocità. qwen2.5:7b "annegava" le istruzioni articolate di canvas/propose
  # (stack che spariva, soggetto derivato al documento tecnico). Per differenziare di nuovo
  # per step (es. un modello più grosso solo per canvas/propose) riattiva `purposes`:
  #purposes:
  #  canvas:
  #    model: "qwen3.5:27b"
  #  propose:
  #    model: "qwen3.5:27b"

  # Prezzi per-modello (USD per milione di token) usati SOLO per stimare cost_usd nel log
  # strutturato delle chiamate Anthropic (core/llm.py, _log_anthropic_usage). Opzionale:
  # se un modello non compare qui (o la sezione manca del tutto), il log riporta comunque
  # input_tokens/output_tokens, semplicemente senza cost_usd — mai un errore.
  pricing:
    claude-sonnet-5:
      input_per_mtok: 3.0
      output_per_mtok: 15.0

  # Tetto di spesa GIORNALIERO (UTC) sulle chiamate Anthropic, con degradazione
  # automatica su un provider locale (core/llm.py, _budget_fallback). Il blocco è
  # COMMENTATO, quindi il guard è disattivato e la risoluzione provider/modello è
  # esattamente quella di sempre: scommentalo solo quando i purpose Claude sono
  # davvero in uso. Il contatore si alimenta dal costo stimato con `pricing` qui
  # sopra: un modello senza prezzo non incide sul tetto (nessuna stima inventata).
  # Raggiunta la soglia, i purpose risolti su anthropic passano a fallback_provider
  # con un WARNING; se quel provider non ha un modello in `models` non si degrada e
  # si resta su Claude — un problema di costo non deve diventare un fallimento di
  # generazione. spend_file (opzionale, relativo a rag/) fa sopravvivere il totale ai
  # riavvii; omesso, il contatore è in-memory e riparte da zero a ogni avvio.
  #budget:
  #  daily_usd: 5.0
  #  fallback_provider: "ollama"
  #  spend_file: "database/llm_spend.json"

vector_database:
  provider: "qdrant"
  collection_name: "vibecraft_events"
  embedding_model: "BAAI/bge-m3" # Modello locale per vettori densi/sparsi

# Contesto governato che àncora Canvas/Propose (core/retrieval.py, api/routes_pipeline.py).
# Il retrieval è a DUE rami: uno di dominio (cosa deve fare la feature) e uno tecnico
# (con quale stack/pattern si implementa, in base al dev_type scelto). Servono due query
# perché una domanda di dominio ("form eventi") non è semanticamente vicina a una spec
# tecnologica ("stack, struttura cartelle"): con una sola query le seconde non risalgono
# mai. Entrambi i rami sono ricerche semantiche sull'intero indice: nessun filtro su path
# o cartelle, nessun documento forzato: cambia la domanda, non il ranking.
retrieval:
  governed_max_chunks: 8   # sezioni del ramo di dominio (normativo/business)
  tech_max_chunks: 3       # sezioni del ramo tecnico; 0 disattiva il ramo

  # Codice implementante iniettato nel contesto di /ask (api/routes_retrieval.py): dopo il
  # retrieval dei documenti si risalgono gli archi IMPLEMENTS entranti (codice -> sezione,
  # calcolati all'indicizzazione per similarità densa) e si iniettano gli snippet dei simboli
  # più fortemente linkati. Così l'LLM vede la spec E la sua implementazione reale e può
  # rispondere a domande comparative ("cosa manca nel form?") invece di fermarsi ai soli
  # documenti normativi. Il grafo indicizza il codice ma la ricerca semantica interroga solo
  # Qdrant (documenti): questo è il ponte codice->risposta. Le ancore non sono solo le sezioni
  # recuperate ma l'intera vicinanza BFS del grafo (stessa espansione della Mappa del Grafo),
  # così emerge anche il codice collegato ai documenti vicini, non solo a quelli che hanno
  # matchato la query — recall più alta a parità di query.
  # Fase 6 di [REGOLA-WF-01] (S3, ADR 0002): le sezioni dei documenti raggiunti SOLO via grafo
  # — non già presenti fra i risultati semantici — entrano nel contesto dell'LLM ordinate per
  # fiducia sul cammino (core/graph_ops.trust_paths) per autorità della fonte. Sono marcate
  # "[via grafo: N hop, fiducia X]" così l'LLM sa che quella sezione non ha matchato la domanda:
  # è arrivata da un legame dichiarato. Il tetto è basso di proposito — il ramo semantico resta
  # il canale principale. 0 = disattiva del tutto e il contesto torna quello di prima di S3.
  #
  # CALIBRATO il 2026-09-07 (S11, R23) — ma NON nella griglia dei pesi: è un TAGLIO nel ramo
  # grafo di /ask, che nessuna suite di retrieval attraversa. Misurato con
  # eval/calibrate_graph_context.py: la stessa app in-process, LLM sostituito da uno stub,
  # le 8 catene multihop di golden_multihop.yaml, top_k=5 (il default di /ask e della
  # console), e per ogni tetto quante catene hanno TUTTE le fonti attese in finestra — a
  # livello di DOCUMENTO (ciò che il tetto governa: quante fonti entrano) e di SEZIONE (quale
  # sezione entra lo decide l'ordinamento di R9, non il tetto).
  #
  #   tetto   catene complete (doc / sezione)   fonti in finestra   contesto medio
  #     0            4/8  /  1/8                    12/19            18.7k caratteri
  #     1            7/8  /  3/8                    14/19            21.3k
  #     2            7/8  /  3/8                    14/19            22.8k   (con alpha 0.1: 8/8)
  #     3            8/8  /  3/8                    14/19            24.6k   <- scelto
  #     4            8/8  /  3/8                    14/19            27.2k
  #     6            8/8  /  3/8                    14/19            31.3k
  #
  # Con alpha=0.1 il gomito era a 2 (sotto perde documenti, sopra non aggiunge nulla): il
  # valore iniziale era già giusto. Con alpha=0.3 — applicato nella stessa sessione — il
  # gomito si sposta a 3: il moltiplicatore di autorità entra anche nell'ordinamento del ramo
  # grafo (`_composito`), e la catena dell'«ultima unità» perde `api_error_contract` a 2 e lo
  # riprende a 3. È la prova, misurata, che questo tetto e alpha sono accoppiati: ricalibrare
  # l'uno senza rimisurare l'altro è l'errore che R20/R23 hanno nominato. Regola di scelta:
  # massimo di catene complete a livello documento, poi sezione; a parità l'attuale, poi il
  # tetto più basso (ogni sezione in più è contesto che l'LLM legge e paga: +1.8k caratteri
  # per passo). Il livello di sezione è fermo a 3/8 da 1 a 6: su 5 catene la sezione attesa
  # NON è quella che l'ordinamento pertinenza × fiducia × autorità sceglie — «il documento
  # entra, la sua sezione no» (R9) è la regola, non l'eccezione, e non è un problema del tetto.
  graph_context_max_chunks: 3   # CALIBRATO 2026-09-07 (S11, con alpha=0.3; era 2, mai calibrato)
  # Pavimento di pertinenza per le sezioni iniettate dal ramo del grafo, RELATIVO al miglior
  # punteggio ColBERT della stessa domanda (0 = nessun pavimento). Relativo e non assoluto
  # per una ragione MISURATA: il MaxSim ColBERT cambia scala con la query. Su due domande del
  # nostro corpus, k=50 candidati ciascuna, il massimo vale 0.511 in un caso e 0.727
  # nell'altro, con mediane 0.421 e 0.459 — una soglia assoluta a 0.45 terrebbe mezza coda
  # della seconda domanda e scarterebbe la risposta CORRETTA della prima (0.511).
  # MISURATO in S5 (2026-08-24), e resta 0.0 — per una ragione che la misura rende esplicita.
  # Sulle 59 domande del golden set il ramo del grafo inietta 118 sezioni. Rapporto fra il loro
  # MaxSim ColBERT e il migliore della stessa domanda:
  #   min 0.327   p10 0.440   p25 0.527   mediana 0.620   p75 0.680   p90 0.764   max 0.811
  # Per confronto, il PEGGIOR risultato che il ramo semantico tiene comunque, sulle stesse
  # domande:  min 0.603   mediana 0.804   max 0.909.
  # Le due distribuzioni quasi non si sovrappongono: praticamente ogni sezione che il grafo
  # inietta è meno pertinente del peggio che il ramo semantico ha già accettato. È esattamente
  # lo scopo del ramo — quelle sezioni NON hanno matchato la domanda, sono arrivate da un legame
  # dichiarato — quindi un pavimento tarato sulla barra semantica (>= 0.80) scarterebbe il 98%
  # delle iniezioni, cioè spegnerebbe il ramo con un altro nome. Sotto 0.33 non scarta nulla.
  # Non esiste un valore intermedio SCEGLIBILE: sceglierlo richiederebbe sapere se una sezione
  # a 0.44 è rumore o contesto utile, e quel giudizio riguarda la RISPOSTA di /ask, che nessun
  # golden set del progetto misura (il nostro misura GET /api/retrieve). Finché quel golden set
  # non esiste, qualunque numero qui sarebbe inventato — l'errore che l'ADR 0002 (D3) documenta.
  # Riaprire quando esiste un set di valutazione sulle risposte, non prima.
  graph_context_min_ratio: 0.0

  code_context_max_snippets: 10  # tetto sugli snippet di codice iniettati (0 = disattiva del tutto)
  code_context_min_weight: 0.5   # soglia sul peso dell'arco IMPLEMENTS (cosine); >= soglia di linking (0.45)

  # Ricerca semantica DIRETTA sul codice (core/retrieval.py: search_code_symbols). Il ponte
  # IMPLEMENTS qui sopra parte SEMPRE dai documenti: trova solo il codice agganciato alle
  # sezioni recuperate, e lo ordina per somiglianza codice→spec. Un simbolo che risponde alla
  # domanda ma che nessuna spec descrive — un DTO con l'elenco dei campi obbligatori, un
  # helper, una query — non emergeva mai, e la risposta restava confinata alla documentazione.
  # Questo ramo confronta il vettore denso della DOMANDA con quelli dei simboli (già calcolati
  # all'indicizzazione e persistiti in code.npz: nessun costo di indicizzazione aggiuntivo,
  # nessun punto in più in Qdrant), e inietta i più simili.
  code_search_max_snippets: 8  # snippet dal ramo semantico diretto (0 = disattiva il ramo)
  code_search_min_score: 0.45  # soglia di coseno domanda→simbolo; sotto è rumore
  # Tetto per FILE sul ramo semantico. I simboli sono a grana fine (una proprietà è un
  # simbolo): senza questo limite un solo file AUTOGENERATO — il proxy WCF Reference.cs —
  # si prendeva 6 posizioni su 8 con dieci varianti della stessa riga, seppellendo le
  # classi DataContract che i campi li dichiarano davvero. 0 = nessun limite.
  code_search_max_per_file: 2
  # Tetto COMPLESSIVO sui due rami sommati (dedup per simbolo, priorità al ramo semantico):
  # senza, il contesto crescerebbe come la somma dei tetti. Default = somma dei due.
  code_context_total_snippets: 12
  # Pavimento di coseno DOMANDA->simbolo sul ponte IMPLEMENTS: stesso segnale e stessa
  # funzione del ramo semantico (search_code_symbols), ristretta ai simboli proposti dal
  # ponte. I simboli senza vettore denso non sono valutabili e restano. Ordine del ponte
  # invariato. 0.0 = disattivato: contesto byte-identico a prima. Agisce sulla composizione
  # del contesto a runtime: cambiarlo richiede un riavvio, non una reindicizzazione.
  # 0.35 verificato il 2026-09-10 sul corpus corrente (golden 58, multihop 8, holdout 7, top_k
  # 5 e 10): testo documentale invariato, copertura invariata, no-op a 0.0 byte-identico a
  # prima (rag/eval/results/implementazione_migliorie_20260910/). 0.45 costava copertura.
  code_link_min_question_score: 0.35

  # Tetti dell'endpoint GET /api/code/search, che espone la stessa ricerca semantica sui simboli
  # a un agente ESTERNO (Claude Code, Cursor) perché scelga quali file aprire invece di leggere
  # tutto code/. Lo scopo dell'endpoint è far consumare MENO token: una risposta che cresce senza
  # limite lo ribalterebbe nel suo contrario, quindi i tetti sono parte della funzione, non
  # protezione dagli abusi. Di default la risposta NON contiene il testo dei simboli (solo
  # symbol_id, file, kind e score): il testo si ottiene con &snippet=true ed è troncato a
  # snippet_chars per voce.
  code_search_api_max_k: 25          # tetto su &k= (l'agente ne chiede tipicamente 5-8)
  code_search_api_snippet_chars: 400 # troncamento del testo per simbolo con &snippet=true

  # Domanda del ramo tecnico. `{dev_type}` è sostituito con l'ambito scelto (una sottocartella
  # di code/), reso a parole: 'logicAgent' -> 'logic agent'. È una QUERY SEMANTICA, non un
  # filtro: recupera ciò che le somiglia, ovunque stia nell'alberatura. Riscrivila col
  # vocabolario e nella lingua dei TUOI documenti — è l'unico punto da adattare per portare
  # la pipeline su un progetto con una tassonomia diversa. Vuota (o tech_max_chunks: 0)
  # disattiva del tutto il ramo tecnico.
  tech_query: "specifica tecnologica {dev_type}: stack tecnologico, linguaggi e framework, pattern architetturali e struttura delle cartelle del progetto {dev_type}"

  # Campo del frontmatter in cui un documento DICHIARA a quale ambito appartiene: il ramo
  # tecnico considera solo i documenti che vi elencano il dev_type scelto (in una qualsiasi
  # grafia: 'logicAgent' trova 'logic-agent', 'logic_agent', 'logicagent'). Non è un
  # force-include di file noti — è il documento che si dichiara, e chiunque si dichiari
  # tale compete alla pari; serve perché spec tecnologiche di ambiti diversi sono quasi
  # gemelle e la sola somiglianza semantica non le separa.
  # Vuoto = nessuno scoping: il ramo tecnico cerca su tutto l'indice (e può pescare la
  # spec dell'ambito sbagliato). Se i tuoi documenti dichiarano l'ambito sotto un'altra
  # chiave, scrivila qui.
  tech_scope_tag_key: "tags"

# Ri-ponderazione per autorità nel retrieval (core/retrieval.py): i pesi per classe di
# documento modulano il ranking finale (fonti normative > informative; archiviate < attive).
# I valori qui sono i default calibrati a mano; ricalibrabili sul golden set con
# `eval/calibrate_authority.py` — usando SEMPRE uno split di validazione per non fare overfit.
authority:
  class_weights:
    IRON_MEMORY: 1.0
    AUTHORIZATION_POLICY: 0.9
    DATA_DICTIONARY: 0.7
    METHODOLOGY: 0.5
  default_weight: 0.7       # peso delle classi non elencate (es. REQUIREMENTS/spec) — CALIBRATO 2026-07-14 (era 0.4)
  archived_decay: 0.3       # moltiplicatore del peso per status ARCHIVED/DEPRECATED/HISTORICAL/OBSOLETE
  boost_alpha: 0.3          # forza del boost di autorità: mult = (1 - alpha) + alpha * peso  (alpha=0 → autorità ignorata) — CALIBRATO 2026-09-07 (S11, griglia congiunta; era 0.1 dal 2026-07-14, 0.4 prima)
  section_restatement_weight: 0.92   # peso di SEZIONE (N4) — CALIBRATO 2026-09-05, CONFERMATO in griglia congiunta con alpha 2026-09-07 (S11); 1.0 = disattivato
  # PERCHÉ ESISTE. `boost_alpha` modula un peso di DOCUMENTO, e fra sezioni sorelle quel peso
  # è identico: il moltiplicatore si semplifica e nessun alpha, per costruzione, può separarle.
  # A3 §4-5 misurò che è proprio lì che vive il 70% del deficit di rango 1, e ne nominò la
  # causa: i «Riepilogo delle Regole», le checklist e gli scenari BDD sono la riformulazione
  # lessicale della regola che li precede — stesso vocabolario, più denso di parole chiave — e
  # il MaxSim di ColBERT premia esattamente questo. La sezione che ILLUSTRA batte quella che
  # STABILISCE.
  #
  # IL SEGNALE NON È UN'EURISTICA SUI TITOLI. Un codice dichiarato in un titolo
  # (`### [SAFEGUARD-AUD-01] …`) marca chi enuncia il vincolo; lo stesso codice in una tabella,
  # una checklist o un blocco Gherkin è una citazione. Sul corpus: 31 sezioni dichiarano, 28
  # citano soltanto, 108 non nominano codici e restano a peso pieno — una sezione senza codici
  # non è una riformulazione. Le 28 penalizzate sono esattamente i «Riepilogo delle Regole»
  # (×5), gli «Scenari Comportamentali BDD», le «Checklist», l'«Indice dei Safeguard».
  #
  # CALIBRATO A k=1, non a k=5/k=10: è l'unico k che misura ciò che questo peso governa, e la
  # nota qui sotto («ricalibrare SEMPRE a un k dove la metrica non sia satura») vale anche qui.
  # 5-fold × 5 seed, tie-break all'incumbent (1.0), stesso protocollo di calibrate_authority:
  #   in-sample   r@1  0.625 -> 0.714
  #   HELD-OUT    r@1  0.626 -> 0.695   guadagno +0.069, dev.std 0.008, POSITIVO su 5 seed su 5
  #   valore scelto in 20 fold su 25: 0.92
  # A k=2 il guadagno held-out è +0.011 con dev.std 0.018 e un seed negativo: la metrica è
  # quasi satura (0.875) e non discrimina. Il valore viene da k=1, ed è dichiarato qui perché
  # è la stessa disciplina che A3 rimproverò a boost_alpha, calibrato dove non si vedeva.
  #
  # CONFERMA FUORI CAMPIONE, su dati che NON hanno scelto il parametro: la suite multihop
  # passa da 0.854 a 0.890 di recall media e da 9 a 10 casi riusciti; r@5, r@10 e la recall
  # avversariale restano identici. Nessun caso del golden set regredisce.
  #
  # IL COSTO, dichiarato: due fonti attese dal golden set VIVONO in una sezione penalizzata
  # (`definition_of_done § 3. Checklist — Livello Funzionalità` e `§ 4. Livello Rilascio`),
  # dove la checklist È la norma e non la riformula. Oggi restano entrambe a rango 1 — la
  # penalità è abbastanza mite da rompere i pareggi fra sorelle senza ribaltare un divario di
  # rilevanza vero — ma è il caso da guardare per primo se un domani questo peso venisse alzato.
  # FORMA ATTENUATA vs MOLTIPLICAZIONE PIENA — chiuso il 2026-08-24 (S5, ADR 0002).
  # [REGOLA-VAL-08] prescriveva `score x authority`, cioè alpha=1.0. Misurato sul golden set
  # avversariale (avversariali r@1 / 59 casi r@5 / 59 casi r@10):
  #   alpha 0.0 -> 0.000 / 0.949 / 0.983      alpha 0.5 -> 0.500 / 0.898 / 0.932
  #   alpha 0.1 -> 0.000 / 0.966 / 0.983      alpha 0.8 -> 0.600 / 0.881 / 0.915
  #   alpha 0.2 -> 0.200 / 0.949 / 0.966      alpha 1.0 -> 0.500 / 0.814 / 0.881
  #   alpha 0.3 -> 0.400 / 0.932 / 0.949
  # La moltiplicazione piena paga 15.2 punti di recall@5 e 10.2 di recall@10 su TUTTO il golden
  # set, e non è nemmeno il massimo sui casi avversariali (alpha=0.8 ne corregge di più): oltre
  # una certa forza il boost promuove i contratti generici sopra le spec specifiche attese.
  # È la conferma, su un golden set che finalmente discrimina, di ciò che la calibrazione del
  # 2026-07-14 aveva visto per caso. La norma è stata EMENDATA per prescrivere questa forma
  # (spec_graph_rag_ingestion.md v2.2.0), non il codice per allinearsi alla norma.
  #
  # PERCHÉ alpha È SALITO A 0.3 (S11, 2026-09-07) — e perché fino a S11 era rimasto a 0.1.
  # Fino a S11 la ragione per non salire era MISURATA (A3/S5, corpus e golden set di allora):
  # a k=1 alpha=0.3 guadagnava (+0.021 held-out, dev.std 0.014, 4 seed su 5), ma /ask inietta
  # fino a 8 sezioni e l'LLM le legge TUTTE, quindi la metrica del consumo è recall@5-@10 —
  # e lì alpha=0.3 PERDEVA (0.966->0.932 e 0.983->0.949): comprava il rango dentro una
  # finestra letta per intero pagandolo con fonti che dalla finestra uscivano.
  #
  # S11 ha rifatto la misura con i tre parametri INSIEME (alpha × default_weight ×
  # unclassified_weight × section_restatement_weight, 2160 punti per griglia, 5-fold × 5
  # seed, tie-break all'incumbent e — nuovo — a parità fra punti nuovi vince chi cambia meno
  # coordinate), sul golden set di S10 (58 casi, 5 avversariali), e quel costo NON C'È PIÙ:
  #
  #   punto fisso (in-sample, 58 casi)     r@1    r@2    r@5    r@10 | avv r@1 | multihop r@10
  #   alpha 0.1, peso sezione 0.92 (prima) 0.690  0.862  0.948  0.983 |  0.000  | 0.890 (10/14)
  #   alpha 0.3, peso sezione 0.92 (ora)   0.741  0.862  0.966  1.000 |  0.800  | 0.890 (10/14)
  #   alpha 0.3, peso sezione 1.0          0.638  0.862  0.966  0.983 |  0.600  | 0.847  (9/14)
  #   alpha 0.1, peso sezione 1.0          0.603  0.845  0.948  0.966 |  0.000  | 0.854  (9/14)
  #   (r@10 = 0.983 «prima» è il pool a 50 candidati del calibratore; il server misura 1.000
  #    a k=10 — a k<=5 i due coincidono al millesimo. Server-identico DOPO, evaluate_recall
  #    con graph+restatements: 0.741 / 0.862 / 0.966 / 1.000.)
  #
  #   CV k=1 : default 0.691 held-out -> calibrato 0.729   guadagno +0.038 (dev.std 0.007)
  #            per seed +0.033 +0.035 +0.035 +0.053 +0.035 — POSITIVO su 5 su 5
  #            scelto in 21 fold su 25: alpha=0.3 con TUTTO il resto invariato (peso di
  #            sezione 0.92 compreso); negli altri 4 alpha=0.5, mai un altro peso di sezione
  #   CV k=2 : la griglia sceglie il peso di sezione 0.8 in-sample (0.897) e PERDE fuori
  #            campione (-0.010, dev.std 0.013): NON_APPLICARE — alpha 0.3 e 0.1 pareggiano
  #   CV k=5 : +0.000 su tutti i seed (0.948): la metrica non discrimina; alpha=0.3 pareggia
  #            in-sample con unclassified_weight=0.1 a 0.966, e nessuno dei due perde
  #
  # Quindi: a k=1 — l'unico k dove la metrica discrimina, lo stesso di N4 — alpha=0.3 batte
  # l'attuale con la disciplina di N4 rispettata (held-out, dev.std bassa, segno positivo su
  # tutti i seed), e a k=2/k=5/k=10 non perde più nulla: +1 caso a k=5 e a k=10, zero a k=2.
  # Sui 5 avversariali passa da 0 a 4 su 5 a rango 1. Il verdetto di A3 non era sbagliato:
  # era vero su quel corpus, e il corpus è cambiato (S5 -> S10). Sulla stessa griglia il peso
  # di sezione 0.92 vince ANCHE con alpha a 0.3 (e a 0.5), e spegnerlo (1.0) perde
  # ovunque; a k=1 il peso 0.92 è scelto in 25 fold su 25: i due sono confermati insieme,
  # non uno alla volta — che era R20.
  #
  # IL PREZZO, misurato prima di applicare: alpha entra anche nell'ordinamento del ramo GRAFO
  # di /ask (routes_retrieval `_composito`: pertinenza × fiducia × (1-α+α·peso)), e a 0.3 la
  # catena multihop dell'«ultima unità» perde il terzo documento (`api_error_contract`, quello
  # che R9 aveva guadagnato) a `graph_context_max_chunks: 2` e lo riprende a 3. Per questo il
  # tetto è salito a 3 nello stesso commit: vedi la nota in `retrieval.graph_context_max_chunks`.
  #
  # LA PREMESSA DI A3 RESTA: l'autorità arriva anche nel PROMPT (classe nell'intestazione dei
  # blocchi e [CLASSE-FONTI], core/retrieval.source_label / authority_scale). Con alpha 0.3 il
  # moltiplicatore vive fra 0.79 e 1.00 invece che fra 0.93 e 1.00: il ranking fa di più, ma
  # dentro la finestra è ancora l'etichetta a dire al modello quale fonte STABILISCE. Se quel
  # meccanismo venisse rimosso, andrebbero rimisurati entrambi.
  # Calibrazione storica (5-fold CV su golden set 34 casi, corpus dominio eventi, 2026-07-14):
  # default_weight 0.4→0.7 e boost_alpha 0.4→0.1 alzarono recall@10 held-out da 0.914 a 0.971.
  # Il boost hand-set era troppo forte: sovra-promuoveva i safeguard IRON_MEMORY generici rispetto
  # alle spec REQUIREMENTS specifiche attese. I valori qui sotto restano quelli di quella corsa.
  #
  # RI-CALIBRAZIONE 2026-07-22 sul corpus cross-progetto (11 doc / 91 chunk, golden set 49 casi):
  # esito NON_APPLICARE, guadagno di validazione +0.000. Nota metodologica: a k=10 e k=5 la recall
  # è SATURA a 1.000 su tutta la griglia — a quei k il risultato non è informativo, nessuna
  # combinazione è distinguibile. La misura utile è a k=2 (recall 0.900 held-out), dove il confronto
  # discrimina: lì anche alpha=0.0, cioè autorità del tutto ignorata, pareggia col default.
  # Interpretazione: il corpus attuale è composto quasi solo da norme ad alta autorità e senza
  # contrasto di classe, quindi il parametro oggi è di fatto inerte. Tornerà a contare quando il
  # corpus rimescolerà classi diverse (spec di dominio, doc importati a 0.70, materiale archiviato).
  # Ricalibrare SEMPRE con split di validazione, e SEMPRE a un k dove la metrica non sia satura.
  #
  # RI-CALIBRAZIONE 2026-08-24 (S5, ADR 0002) — la prima su un golden set che DISCRIMINA.
  # Corpus: 26 documenti / 175 chunk (indice v20260824T150025). Golden set: 59 casi, di cui 10
  # AVVERSARIALI costruiti apposta perché una fonte a bassa autorità (informativa METHODOLOGY
  # 0.50, o senza alcuna classificazione 0.30) matchi lessicalmente MEGLIO della normativa che
  # risponde. Ognuno verificato eseguendo la query: in tutti e dieci il distrattore precedeva
  # la fonte attesa. Griglia a tre assi (9 alpha x 6 default_weight x 5 unclassified_weight),
  # 5-fold CV su 5 seed.
  #
  #   k=1 : default 0.474 held-out -> calibrato 0.495   guadagno +0.021 (dev.std 0.014)
  #   k=2 : default 0.763 held-out -> calibrato 0.776   guadagno +0.013 (dev.std 0.017)
  #   k=5 : default 0.967 held-out -> calibrato 0.967   guadagno +0.000 (dev.std 0.000)
  #   Esito: NON_APPLICARE. I valori qui sotto restano invariati. A k=5 — il k che corrisponde
  #   a ciò che /ask consuma davvero — la configurazione attuale È l'ottimo di griglia, e il
  #   guadagno a k=1 ottimizza il rango dentro una finestra che l'LLM legge per intero (vedi
  #   la nota su boost_alpha qui sopra).
  #
  # L'AUTORITÀ SERVE (ed è la risposta che il vecchio golden set non poteva dare). Sui 10 casi
  # avversariali, recall@5: autorità SPENTA (alpha=0.0) = 0.900, produzione attuale = 1.000.
  # Spegnerla perde un caso su dieci. Non è inerte: semplicemente non lavora a rango 1.
  #
  # PRIMA E DOPO S1-S4 (stesse query, cambiano solo i parametri che S1 ha introdotto):
  #   PRIMA (use_declared=false, unclassified appiattito su 0.70): r@1 0.492 r@5 0.949 r@10 0.983
  #   DOPO  (use_declared=true,  unclassified=0.30)              : r@1 0.475 r@5 0.966 r@10 0.983
  #   Sui 10 avversariali: identici, 10 su 10 ancora sbagliati a rango 1 sia prima sia dopo.
  # S1-S4 hanno spostato +0.017 di recall@5 e -0.017 di recall@1, e NULLA sui casi avversariali:
  # con alpha=0.1 il moltiplicatore vive fra 0.93 e 1.00, un 7% che non ribalta un distacco
  # ColBERT di 0.05-0.15. Hanno reso l'autorità ESPRIMIBILE; la forza per usarla è un'altra cosa.
  #
  # DUE CORREZIONI DI METODO, entrambe nate da un errore vero commesso in questa sessione:
  #   1. `default_weight` è un ASSE MORTO su questo corpus: nessuno dei 26 documenti passa da
  #      quel ramo (14 dichiarano authority, 6 hanno la classe elencata, 6 non sono classificati).
  #      Con un asse morto ogni alpha ha decine di configurazioni identiche, e grid_best
  #      scioglieva il pareggio per ordine di iterazione — diversamente da fold a fold, cioè
  #      rumore puro nella stima held-out. Misurato: il guadagno a k=2 è passato da -0.011 a
  #      +0.013 fra due corse che differivano per la ri-segmentazione di UN documento su 26.
  #      Ora a parità di recall vince la configurazione ATTUALE, e gli assi morti sono segnalati.
  #   2. La CV girava su UN SOLO seed. Su una corsa intermedia il seed 0 dava +0.018 (sopra la
  #      soglia di applicazione) mentre la media su 5 seed era -0.007, e quel +0.018 era l'unico
  #      positivo su cinque. Default ora a 5 seed, con deviazione standard riportata.
  # Ricalibrare SEMPRE con split di validazione, SEMPRE a un k non saturo, SEMPRE su più seed.
  #
  # RI-CALIBRAZIONE 2026-08-25, dopo il ripristino del baseline committato di docs/.
  # Tre file erano fermi su disco alla v1.0.0 dominio-specifica mentre in git c'era la
  # v2.0.0 cross-progetto; il RAG indicizza il disco, e la divergenza era invisibile a
  # git status (skip-worktree). Corpus da 175 a 180 chunk; casi avversariali da 10 a 9.
  #   59 casi: r@1 0.475->0.576  r@2 0.763->0.797  r@5 0.966->0.983  r@10 0.983->1.000
  #   k=5, 5-fold su 5 seed: default 0.983 -> calibrato 0.983, guadagno +0.000 (dev.std
  #   0.000 su TUTTI i seed). Esito NON_APPLICARE, e la configurazione attuale resta
  #   l'ottimo di griglia. Nessun parametro modificato.
  # CADE però un'affermazione della nota del 2026-08-24: là l'autorità "serviva" perché
  # spegnerla costava un caso avversariale su dieci a k=5 (1.000 vs 0.900). Ora autorità
  # spenta e produzione danno lo STESSO 0.889 sui 9 casi: ad alpha=0.1 il meccanismo è
  # NEUTRO su quei casi, non dannoso e non utile. Recupera il caso solo ad alpha 0.2-0.3,
  # che continua a non sopravvivere alla validazione.
  # Conseguenza operativa: recall@10 è tornata SATURA (1.000 su tutti i 59) e l'eval-gate
  # è stato spostato a k=5 — vedi il blocco eval_gate più sotto.
  #

  # ─── Autorità DICHIARATA nel frontmatter (ADR 0002 / S1, 2026-08-18) ───────────────────
  # I due default qui sotto NON sono intercambiabili, e confonderli è il difetto che S1 corregge.
  #
  #   default_weight (0.7)       → la classe C'È ma non è elencata in class_weights. Tipicamente
  #                                REQUIREMENTS, cioè le spec: 0.7 è un valore CALIBRATO
  #                                (grid search 2026-07-14). Significa "so cos'è, vale molto".
  #   unclassified_weight (0.3)  → la fonte NON ha alcuna classificazione. read_document()
  #                                restituisce frontmatter vuoto per ogni formato non-.md
  #                                (pdf, docx, xlsx, txt): un documento importato senza metadati
  #                                di governance non deve pesare quanto una spec calibrata.
  #                                Significa "non so nulla di questa fonte, la tratto con cautela".
  #
  # Finché i due casi condividevano 0.7, un PDF importato entrava nel ranking alla pari di una
  # spec normativa — l'inversione di priorità che [REGOLA-VAL-08] cita come failure mode.
  use_declared: true        # onora `authority:` del frontmatter come coefficiente per-documento
                            # (precede il peso di classe). KILL-SWITCH: è l'unico interruttore che
                            # riporta all'ordinamento storico, perché questo cambia il ranking di
                            # produzione senza passare da un parametro numerico. Un valore assente,
                            # non numerico o fuori [0,1] degrada al peso di classe (con warning),
                            # non fa fallire la richiesta.
  unclassified_weight: 0.3  # peso di una fonte SENZA classificazione — vedi nota sopra

  # ─── Precedenza esplicita fra fonti (ADR 0002 / S4) ───────────────────────────────────
  # Nome della relazione con cui un autore dichiara, nel frontmatter, che il suo documento
  # prevale su un altro: «quando questo e quell'altro dicono cose diverse, vince questo».
  # I pesi qui sopra rispondono PER CLASSE (segnale statistico); questa risponde per COPPIA
  # SPECIFICA, ed è quindi il segnale più preciso che abbiamo — l'unico che copre due
  # documenti della stessa classe, con la stessa autorità, che si contraddicono.
  # Non è hardcodata perché il vocabolario delle relazioni nasce dal frontmatter: un progetto
  # istanziato dalla nostra baseline può usarne un altro. Stringa vuota = meccanismo spento.
  precedence_relation: "SUPERA_IN_PRIORITÀ"

# Fiducia sugli archi del grafo (S2, ADR 0002): ogni arco ha una NATURA (strutturale/curata/
# inferita) e un'affidabilità numerica. È solo etichettatura — S2 non cambia alcun ranking —
# ma è il substrato che S3 (fiducia sul cammino BFS) e S4 (conflitti fra fonti) useranno.
# I valori sono EMPIRICI (istinto e buonsenso, come i pesi di authority.*): ricalibrabili
# quando S3/S4 li mettono davvero alla prova, non costanti universali.
graph_trust:
  # Affidabilità di default per natura, se l'arco non ne porta una propria.
  nature_reliability:
    structural: 1.0   # dedotta da filesystem o parsing deterministico: se è sbagliata è un bug
    curated: 0.9       # dichiarata da un umano nel frontmatter: un umano può sbagliare a scrivere un target
    inferred: 0.6      # congettura di un algoritmo (coseno, euristica sui nomi): penalizzata per costruzione
  # Relazione -> natura. Il vocabolario delle relazioni CRESCE dal frontmatter dei documenti
  # (un autore può dichiarare un `type:` nuovo domani): una relazione ASSENTE da questa mappa
  # ricade su "curated", perché arriva dal frontmatter, quindi da un umano — non su "inferred",
  # che è riservato alle relazioni che il codice produce per euristica/similarità (elencate qui).
  relation_nature:
    PART_OF: structural       # sezione -> documento, struttura del file
    MENTIONS: structural      # documento -> entità, regex sul corpo
    IMPLEMENTS: inferred      # codice -> sezione, argmax di similarità coseno
    REFERENCES: inferred      # codice -> entità/codice, euristica sui nomi
    DEPENDS_ON: inferred      # codice -> codice, risoluzione best-effort per nome
    READS: inferred           # SQL, scanner ibrido tree-sitter + regex
    WRITES: inferred          # SQL, scanner ibrido tree-sitter + regex
    EXECUTES: inferred        # SQL/shell, scanner ibrido tree-sitter + regex

# Eval-gate continuo (core/eval_gate.py): prima di promuovere una nuova versione dell'indice
# (blue/green), misura la recall del retrieval sul golden set. Se scende sotto la soglia, blocca
# la promozione (CURRENT resta sull'ultima versione buona) e scrive un alert critico. Fail-open:
# se il golden set manca o il gate è disattivo, la promozione procede (non blocca i primi build).
eval_gate:
  enabled: true
  k: 2                 # soglia di recall valutata (recall@k)
  # DA k=10 A k=5, il 2026-08-25 — e l'alert di saturazione ha fatto esattamente il suo lavoro.
  # Storia in tre passi, che vale la pena non riscrivere:
  #   1. sul golden set di 49 casi recall@10 valeva 1.000: il gate passava per costruzione e
  #      avrebbe promosso anche una candidata peggiorata, senza che nulla lo dicesse;
  #   2. i 10 casi avversariali di S5 la riportarono a 0.983 — la metrica tornava a discriminare
  #      e k=10 restava difendibile;
  #   3. ripristinato il baseline committato di docs/ (2026-08-25) tutti e 59 i casi rientrano
  #      in top-10: recall@10 = 1.000, di nuovo SATURA, e questa volta il gate lo ha DETTO
  #      (alert warning da gate_promotion). Da qui lo spostamento a k=5.
  #
  # PERCHÉ NON PIÙ k=5. Il criterio resta quello: /ask inietta fino a
  # `retrieval.governed_max_chunks: 8` sezioni e l'LLM le legge tutte, quindi la misura giusta
  # sarebbe la più vicina a quel consumo — @5. Ma un gate deve prima di tutto DISCRIMINARE, e
  # dopo l'istanziazione recall@5 vale 1.000 su tutti i 59 casi. Fra "vicina al consumo" e
  # "capace di distinguere una regressione" vince la seconda: una misura satura non è
  # conservativa, è cieca.
  #   4. poche ore dopo, ISTANZIATO safeguards_security.md sul dominio (Sezione 0 compilata,
  #      60 segnaposto risolti): il corpus smette di rispondere "<<RISORSA_CONTESA>>" e dice
  #      "posti_residui". Il retrieval migliora ancora — r@2 0.797->0.814, e sul sottoinsieme
  #      avversariale 0.556->0.667 — e recall@5 arriva a 1.000: SATURA anche lei, alert di
  #      nuovo scattato. Da qui k=5 -> k=2.
  #
  # k=2 è l'ultimo k su cui il gate resta stabile: la soglia è 0.75, poco sotto il misurato
  # (0.797). NB: recall@5 era saturata a 1.000 subito dopo l'istanziazione ed è poi tornata a
  # 0.983 quando il corpus si è arricchito (innesto dei blocchi di dominio + scheda
  # BUDGET_ANNUO). Il gate NON è stato riportato a k=5: un gate che insegue il corpus a ogni
  # modifica non è un gate, e la stabilità della soglia vale più di qualche punto di
  # sensibilità. Se anche recall@2
  # dovesse saturare non resta un k più basso utile: vorrà dire che il golden set ha smesso
  # di essere una misura e va ESTESO con casi che il sistema sbaglia, non abbassata un'altra
  # soglia. Mai alzare min_recall a un k saturo, che non misura nulla comunque.
  min_recall: 0.75     # promozione bloccata se recall@k medio scende sotto questo valore
  blocking: true       # true = blocca la promozione; false = solo alert (advisory), promuove comunque

# Suite STRUTTURALE/MULTIHOP (eval/run_multihop.py, golden_multihop.yaml) — blocco a se'
# perche' NON e' il gate di promozione: non gira alla promozione blue/green, gira nel check
# notturno. Tenerlo dentro `eval_gate:` avrebbe suggerito che la promozione lo consulta.
#
# PERCHE' UNA SOGLIA SULLA RECALL MEDIA E NON SUI CASI RIUSCITI. Quattro casi su 14 NON
# possono passare, per costruzione e non per un difetto: l'enumerazione dei documenti chiede
# 11 fonti a un top-10, e le tre catene che spandono tre documenti si fermano a due. E'
# esattamente il gap che questa suite esiste per quantificare (vedi la testata del golden
# set). Gatare su "A riusciti" significherebbe gatare su un numero che il sistema non puo'
# far salire; la recall media, invece, PEGGIORA se il ranking peggiora — ed e' quello che si
# vuole sorvegliare.
#
# 0.85 con 0.896 misurato: gli stessi ~4-5 punti di margine del gate single-hop. A differenza
# di recall@10 sul golden set, qui la metrica non e' MAI stata satura.
eval_multihop:
  enabled: true
  min_recall: 0.85     # soglia sulla recall media della baseline A (retrieval, k=10)
  # Le attese strutturali di B sono 6 casi verificati a mano sul grafo, e asseriscono
  # relazioni, non conteggi: se una si rompe e' una regressione del router, non rumore del
  # corpus. Per questo la soglia e' l'esattezza piena e non una frazione.
  require_graph_exact: true

paths:
  docs_dir: "./docs"
  codebase_dir: "./code"

# Intake & Import (piano: docs/00_meta_governance/piano_intake_import.md): ingresso controllato
# della conoscenza, con staging + review esplicita prima di docs/ o code/ (mai un ingresso diretto).
# Le esclusioni per l'import progetti riusano code_parsers/CODE_EXCLUDED_DIRS: non duplicarle qui.
intake:
  staging_dir: "database/staging"   # relativo a rag/, accanto agli altri artefatti di database/
  # Conversione per formato: PDF Docling, XLSX/XLS lettura diretta (openpyxl/xlrd), MD nativo,
  # altri MarkItDown. Estendibile a ogni formato che markitdown sa gestire coi convertitori built-in.
  allowed_formats: ["md", "pdf", "docx", "pptx", "xlsx", "doc", "xls", "ppt", "html", "htm", "txt", "csv", "json", "xml", "epub", "msg"]
  max_upload_mb: 25
  # Motore dei PDF (core/intake_convert.py): Docling con la configurazione verificata dal pilot
  # (StandardPdfPipeline, CPU, TableFormer ACCURATE, gerarchia dei titoli dallo stile; OCR
  # locale RapidOCR solo per le pagine senza testo selezionabile). Gli altri formati ammessi
  # usano MarkItDown tranne XLSX/XLS (lettura diretta) e MD (nativo). Se Docling fallisce, il PDF
  # passa da MarkItDown con fallback DICHIARATO nella preview. enabled: false = PDF su MarkItDown
  # (riavvio, niente reindicizzazione; i documenti già approvati non cambiano). Non tocca Excel.
  docling:
    enabled: true
    models_dir: "database/models/docling"   # pesi fissati e verificati: scripts/docling_models.py
    timeout_seconds: 300
  # Formati binari legacy DOC e PPT: LibreOffice headless li normalizza nel formato moderno
  # (DOCX, PPTX), poi vale la matrice del formato moderno. Sui formati moderni LibreOffice non ha
  # migliorato l'estrazione (rag/eval/results/libreoffice_20260910/); gli XLS non passano di qui,
  # li legge xlrd senza alterare numeri e booleani (rag/eval/results/excel_diretto_20260911/).
  # Ogni conversione usa un profilo temporaneo blindato (macro spente, collegamenti mai
  # aggiornati, nessun ricalcolo delle formule). Se LibreOffice manca o non risponde, DOC e PPT
  # danno un errore esplicito. enabled: false = come "manca".
  libreoffice:
    enabled: true
    command: ""          # vuoto: soffice nel PATH, o l'installazione predefinita su Windows
    timeout_seconds: 120
  generation_max_files: 5
  # Authority di default scritta nel frontmatter dei documenti approvati dallo staging
  # (S2): sotto i documenti autorati a mano (0.75-0.90) ma sopra il default implicito
  # del retrieval (authority.default_weight 0.4) — un doc importato è citabile ma non
  # deve mai vincere su una spec normativa a parità di match.
  default_authority: 0.70
  # Raffinazione LLM di un documento in staging (core/intake_refine.py): dal dump del
  # convertitore alla spec strutturata (sezioni ##, tabelle, blocchi di codice). È un passo
  # OPT-IN del ciclo di review, non della conversione — la pulizia deterministica
  # (core/intake_clean.py) resta invece sempre attiva e non passa da qui.
  refine:
    # Caratteri per finestra inviata al modello. Va tenuta ben sotto llm_settings.ollama_num_ctx
    # (16384 token ≈ 49.000 caratteri) perché al testo si somma il prompt e soprattutto la
    # RISPOSTA, che è lunga quanto l'input: oltre, Ollama tronca in silenzio.
    window_chars: 5000
    # Forbice ammessa per lunghezza_riscritta / lunghezza_originale: fuori da questa, la
    # riscrittura della finestra viene scartata e si tiene il testo pulito. Sotto il minimo
    # il modello ha RIASSUNTO (e un riassunto perde requisiti); sopra il massimo ha
    # COMMENTATO o ipotizzato invece di riformattare — su una fonte frammentaria (tabelle
    # di PDF, diagrammi di classe) tende a riempire i buchi con congetture del tipo
    # "inferito", "potrebbe riferirsi", che in un documento normativo sono peggio del
    # testo grezzo. Alzare min_output_ratio rende la raffinazione più conservativa;
    # abbassarlo (es. 0.15) accetta anche riscritture molto più sintetiche dell'originale.
    min_output_ratio: 0.45
    max_output_ratio: 2.0
    # Il tetto vale per la PROSA. Le fonti dense (alberi di classi, elenchi di campi,
    # tabelle sfaldate dal PDF: righe mediamente più corte di dense_line_chars) crescono
    # legittimamente di 3-4× quando diventano tabelle Markdown con una colonna di
    # descrizione — misurato su NSF_DatiFascicoloEDocumentiResponse, dove una riscrittura
    # corretta e senza congetture pesa 3,5× l'originale. Con un tetto unico a 2.0 quelle
    # riscritture verrebbero scartate proprio dove il passo serve di più.
    max_output_ratio_dense: 4.0
    dense_line_chars: 40

# Implementazione del parser simboli per linguaggio (code_index). Python usa sempre
# stdlib ast e non ha flag. TypeScript/JavaScript/Svelte non hanno più un flag qui:
# erano l'unico linguaggio con un secondo parser (regex) dietro `code_parsers.<lang>`,
# rimosso il 2026-09-03 (A12) dopo 53 giorni senza incidenti dalla migrazione a
# tree-sitter (2026-07-12) — mantenere una chiave che sceglie fra due implementazioni
# quando ne esiste una sola non è configurazione, è un'affermazione falsa.
code_parsers:
  # Java: unica implementazione (tree-sitter, nessun fallback regex). Copre anche
  # gli artefatti di progetto: pom.xml / build.gradle (dipendenze -> DEPENDS_ON)
  # e Kogito .bpmn/.bpmn2/.dmn (processi/decisioni). Estensioni registrate nel
  # dispatch di code_index/: .java, .bpmn, .bpmn2, .dmn + pom.xml/build.gradle.
  java: "treesitter"
  # C#/.NET: unica implementazione (tree-sitter-c-sharp dal language-pack),
  # runtime-agnostica (Framework e Core/5+). Copre anche .csproj
  # (PackageReference/ProjectReference -> DEPENDS_ON) e packages.config legacy.
  # Estensioni registrate nel dispatch di code_index/: .cs, .csproj + packages.config.
  csharp: "treesitter"
  # Razor (.cshtml/.razor): scanner ibrido dedicato (niente grammatica tree-sitter,
  # immatura): direttive/markup via scanner, blocchi @code via parser C#. Dialetti:
  # .razor=componente Blazor, .cshtml con @page=Razor Page, senza @page=view MVC.
  razor: "hybrid"
  # SQL (.sql, .pks/.pkb PL/SQL): ibrido tree-sitter-sql + scanner regex per i
  # dialetti (la grammatica non regge il procedurale). Archi semantici:
  # READS/WRITES/EXECUTES. sql_dialect = dialetto predefinito del repo quando
  # l'euristica sul contenuto non decide: tsql | plsql | generic.
  sql: "hybrid"
  sql_dialect: "generic"
  # Script operazionali (.sh Bash, .ps1/.psm1 PowerShell): entrambi tree-sitter
  # (grammatica PowerShell del language-pack verificata matura). Nodi script/
  # function, archi EXECUTES script->script e verso progetti/file invocati.
  shell: "treesitter"
  # Pipeline CI/CD riconosciute per NOME (pyyaml): GitLab CI e Azure DevOps.
  # Gli altri .yml (rag_config, application*.yml, ...) restano esclusi;
  # docker-compose/compose hanno il proprio parser (docker_patterns).
  ci_patterns:
    - ".gitlab-ci.yml"
    - "*.gitlab-ci.yml"
    - "*.gitlab-ci.yaml"
    - "azure-pipelines.yml"
    - "azure-pipelines*.yml"
    - "azure-pipelines*.yaml"
  # File di configurazione indicizzati per NOME (stdlib XML/JSON, secret sempre
  # mascherati): web/app.config + trasformazioni, appsettings*.json, package.json,
  # WSDL/XSD. Pattern fnmatch sovrascrivibili qui; gli altri .json/.xml restano
  # esclusi (dati, non struttura).
  config_patterns:
    - "web.config"
    - "app.config"
    - "web.*.config"
    - "app.*.config"
    - "appsettings.json"
    - "appsettings.*.json"
    - "package.json"
    - "*.wsdl"
    - "*.xsd"
    - "application.properties"
    - "application-*.properties"
    - "application.yml"
    - "application.yaml"
    - "application-*.yml"
    - "application-*.yaml"
  # Artefatti Docker riconosciuti per NOME (pyyaml per il compose, scanner
  # riga-per-riga per il Dockerfile): docker-compose/compose *.yml -> nodi
  # service (immagine, porte, depends_on -> DEPENDS_ON, build -> Dockerfile);
  # Dockerfile -> nodo image (immagini base, stage, EXPOSE). Secret mascherati.
  docker_patterns:
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "docker-compose.*.yml"
    - "docker-compose.*.yaml"
    - "compose.yml"
    - "compose.yaml"
    - "compose.*.yml"
    - "compose.*.yaml"
    - "dockerfile"
    - "dockerfile.*"
    - "*.dockerfile"

# Verifica ESEGUITA del codice prodotto da un run agentico (core/verification.py).
# Il resoconto dei punti aperti e' dichiarato dall'agente e nessun runner ha una shell:
# senza questo blocco "implementato e verificato" resta un'opinione del modello. Qui il
# SERVER esegue la suite dell'ambito dopo il run e l'esito diventa la condizione d'uscita
# del rilancio automatico (api/routes_pipeline.py).
#
# I comandi sono liste argv eseguite SENZA shell, e vengono solo da qui: ne' il modello
# ne' il client possono sceglierli. Un ambito senza comando non e' un verde: l'esito e'
# 'unavailable' e la feature resta dichiarata non verificata.
verification:
  enabled: true
  timeout_seconds: 900
  max_output_chars: 4000
  # Numero massimo di run per una singola richiesta agentic: il primo piu' i rilanci
  # automatici sulle failure. 1 = nessun rilancio (comportamento storico). Il client puo'
  # chiedere meno, mai piu' di questo tetto.
  max_attempts: 3
  commands:
    frontend: ["npm", "test"]          # package.json -> vitest run
    backend: ["dotnet", "test"]        # Portal.sln
    logicAgent: ["dotnet", "test"]     # Portal.LogicAgent.slnx
