# rag_config.yaml
# Configurazione globale del sistema HARO Graph-RAG

llm_settings:
  # Valori supportati: "anthropic" (Claude 3.5 Sonnet), "openai" (GPT-4o), "ollama" (locale)
  #active_provider: "anthropic"
  active_provider: "ollama"
  
  # Modelli specifici per provider
  models:
    anthropic: "claude-sonnet-5"
    openai: "gpt-4o"
    ollama: "qwen2.5:7b" # o mistral/llama3

vector_database:
  provider: "qdrant"
  collection_name: "vibecraft_events"
  embedding_model: "BAAI/bge-m3" # Modello locale per vettori densi/sparsi

paths:
  docs_dir: "./docs"
  codebase_dir: "./code"

# Implementazione del parser simboli per linguaggio (code_index).
# Valori: "treesitter" (default, migrazione completata) | "regex" (fallback
# d'emergenza, storica). Python usa sempre stdlib ast e non ha flag.
code_parsers:
  typescript: "treesitter"
  javascript: "treesitter"
  svelte: "treesitter"
  # Java: unica implementazione (tree-sitter, nessun fallback regex). Copre anche
  # gli artefatti di progetto: pom.xml / build.gradle (dipendenze -> DEPENDS_ON)
  # e Kogito .bpmn/.bpmn2/.dmn (processi/decisioni). Estensioni registrate nel
  # dispatch di code_index.py: .java, .bpmn, .bpmn2, .dmn + pom.xml/build.gradle.
  java: "treesitter"
