# Golden-set M1 — domande STRUTTURALI e MULTI-HOP (milestone "versione definitiva").
#
# Misura il gap tra il retrieval vettoriale (baseline A: GET /api/retrieve, k=10) e la
# query deterministica sul grafo (riferimento B: GET /api/graph/query) per decidere il
# TRIGGER della milestone M2 (router strutturale/multihop davanti al retrieval).
# Harness: eval/run_multihop.py (script separato da eval/run.py: schema dei casi diverso,
# doppia misura A/B — vedi docstring del modulo per la motivazione del diff).
#
# Formato di ogni caso:
#   q          : domanda in italiano (la stessa per A e per B)
#   kind       : "structural" (risposta = nodi/archi esatti del grafo)
#              | "multihop"   (risposta = combinare 2+ documenti collegati nel grafo)
#   target     : (opzionale) id del nodo bersaglio passato a /api/graph/query — il caso
#                lo dichiara quando il chiamante reale (es. click sulla Semantic Map)
#                conoscerebbe già il nodo; assente = rilevamento testuale di graph_query.
#   expected:
#     retrieval: lista di matcher (STESSO formato di golden_set.yaml / core.eval_metrics:
#                doc/section/chunk/file/any, substring case-insensitive) per la baseline A.
#                A "riuscito" = TUTTI i matcher trovati in top-10 (recall == 1.0).
#     graph    : (solo structural) atteso ESATTO da graph_query per il riferimento B:
#                  intent     : intent che graph_query deve riconoscere
#                  count      : (opz.) valore esatto del campo `count` della risposta
#                  nodes      : (opz.) nodi che DEVONO comparire nella risposta
#                  relations  : (opz.) archi che devono comparire: {relation, node}
#                               (node cercato sia tra gli archi out.to sia in.from)
#                B "riuscito" (exact-node-match) = intent uguale + count uguale (se
#                dichiarato) + tutti i nodes presenti + tutte le relations presenti.
#   evidence   : perché la risposta è quella — percorso/archi nel grafo reale.
#   answer_note: sintesi attesa della risposta corretta.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# RISCRITTO 2026-07-22 sul corpus cross-progetto.
#
# La versione precedente misurava il trigger M1→M2 sullo snapshot v20260721T084111
# (566 nodi / 879 archi / 174 chunk) del corpus "prenotazione eventi aziendali": tutti e
# 14 i casi puntavano a documenti poi rimossi. Quella misura ha già esaurito il suo scopo
# — il trigger M2 è scattato e il router deterministico è stato implementato — quindi
# questo file NON prova a ricostruirla: riparte come strumento di regressione sul corpus
# attuale. Le baseline A/B storiche restano in eval/results/multihop_20260721_*.json e
# NON sono confrontabili con le corse su questo file.
#
# Grafo di riferimento: snapshot v20260722T105547 — 204 nodi (11 document / 91 section /
# 102 entity) / 302 archi / 91 chunk. Tutti i valori in `expected.graph` sono stati MISURATI
# eseguendo core.graph_ops.graph_query su questo snapshot, non stimati: 6/6 attese
# strutturali verificate al 2026-07-22.
#
# Le attese hanno già retto un cambio di snapshot: la pulizia dell'estrattore di entità
# (v20260722T103724 -> v20260722T105547) ha tolto 22 nodi spuri e 30 archi MENTIONS, e
# nessun caso è fallito — proprio perché si asseriscono relazioni e non conteggi.
#
# BASELINE A MISURATA (retrieval vettoriale k=10, alpha=0.1 default_weight=0.7, stesso
# snapshot): structural recall@10 = 0.924 (n=6) — multihop recall@10 = 0.875 (n=8).
# Invariata prima e dopo la pulizia dei nodi entità: il retrieval lavora sui chunk, che
# non sono cambiati.
# I due deficit sono quelli attesi e sono il motivo per cui questo file esiste:
#   - "quali documenti esistono nel corpus?" → 6 matcher su 11 in top-10. Il limite è
#     strutturale, non di ranking: 11 documenti non entrano in 10 posizioni. Nessuna
#     calibrazione può risolverlo, solo il router deterministico.
#   - le 3 catene che spandono TRE documenti si fermano a 2 su 3. Le catene a due
#     documenti passano tutte.
# A differenza del golden_set single-hop — dove recall@10 è satura a 1.000 e non
# distingue nulla — qui la metrica discrimina, quindi è questo il file da guardare per
# valutare regressioni di ranking.
#
# Nota di progettazione sui `count`: dichiarato solo dove è semanticamente stabile
# (l'enumerazione dei documenti). Per relazioni/impatto è deliberatamente OMESSO: quei
# conteggi cambiano a ogni modifica di un documento qualsiasi, e un golden-set che
# fallisce per una virgola aggiunta altrove misura il rumore, non la regressione. Al suo
# posto si asseriscono `relations`/`nodes` specifici, che restano veri finché il legame
# esiste — che è esattamente ciò che il caso vuole proteggere.
# ─────────────────────────────────────────────────────────────────────────────────────
cases:
  # ───────────────────────────── STRUCTURAL ─────────────────────────────

  - q: "quali documenti esistono nel corpus?"
    kind: structural
    expected:
      retrieval:  # enumerazione completa: 11 documenti (top-10 può coprirne al più 10)
        - {doc: "00_meta_governance/definition_of_done.md"}
        - {doc: "00_meta_governance/policy_versionamento_documentale.md"}
        - {doc: "00_meta_governance/safeguards_security.md"}
        - {doc: "01_architecture_norms/api_error_contract.md"}
        - {doc: "01_architecture_norms/coding_standards.md"}
        - {doc: "01_architecture_norms/observability_standards.md"}
        - {doc: "01_architecture_norms/testing_strategy.md"}
        - {doc: "01_architecture_norms/ui_ux_brand_directives.md"}
        - {doc: "02_specs_normative/spec_graph_rag_ingestion.md"}
        - {doc: "04_knowledge_informative/vibe_coding_workflow.md"}
        - {doc: "README.md"}
      graph:
        intent: documenti
        count: 11
        nodes:
          - "00_meta_governance/safeguards_security.md"
          - "01_architecture_norms/api_error_contract.md"
          - "04_knowledge_informative/vibe_coding_workflow.md"
          - "README.md"
    evidence: >-
      by_type("document") sul grafo restituisce 11 nodi. Il retrieval vettoriale non può
      enumerare: top-10 copre al più 10 degli 11 documenti, quindi A è strutturalmente
      incapace di recall 1.0 su questo caso. È il caso-tipo che motiva il router.
    answer_note: "Undici documenti, elencati per percorso."

  - q: "quali sono le relazioni di safeguards_security.md?"
    kind: structural
    target: "00_meta_governance/safeguards_security.md"
    expected:
      retrieval:
        - {doc: safeguards_security}
      graph:
        intent: relazioni
        relations:
          - {relation: EREDITA_VINCOLI, node: "01_architecture_norms/api_error_contract.md"}
          - {relation: EREDITA_VINCOLI, node: "01_architecture_norms/observability_standards.md"}
          - {relation: EREDITA_VINCOLI, node: "01_architecture_norms/testing_strategy.md"}
          - {relation: EREDITA_VINCOLI, node: "02_specs_normative/spec_graph_rag_ingestion.md"}
          - {relation: CONNESSA_A, node: "01_architecture_norms/coding_standards.md"}
    evidence: >-
      Misurato: 39 archi totali (22 out / 17 in). I quattro EREDITA_VINCOLI entranti sono
      le norme che dichiarano di ereditare gli invarianti dei safeguard. Il retrieval
      vettoriale trova il documento ma non sa dire CHI dipende da lui: la direzione
      dell'arco non è recuperabile da un chunk.
    answer_note: >-
      safeguards_security è ereditato da api_error_contract, observability_standards,
      testing_strategy e spec_graph_rag_ingestion, ed è connesso a coding_standards e
      vibe_coding_workflow.

  - q: "cosa impatta la modifica di safeguards_security.md?"
    kind: structural
    target: "00_meta_governance/safeguards_security.md"
    expected:
      retrieval:
        - {doc: safeguards_security}
      graph:
        intent: impatto
        nodes:
          - "01_architecture_norms/api_error_contract.md"
          - "01_architecture_norms/observability_standards.md"
          - "01_architecture_norms/testing_strategy.md"
    evidence: >-
      Misurato: 186 nodi raggiunti in 2 anelli (37 al primo, 149 al secondo). Il primo
      anello contiene le sezioni proprie più i documenti direttamente collegati. È la
      query di Impact Ripple: nessun singolo chunk la contiene.
    answer_note: >-
      La modifica si propaga a tutte le norme che ereditano i suoi invarianti, in primis
      api_error_contract, observability_standards e testing_strategy.

  - q: "quali relazioni ha api_error_contract.md?"
    kind: structural
    target: "01_architecture_norms/api_error_contract.md"
    expected:
      retrieval:
        - {doc: api_error_contract}
      graph:
        intent: relazioni
        relations:
          - {relation: EREDITA_VINCOLI, node: "00_meta_governance/safeguards_security.md"}
          - {relation: CONNESSA_A, node: "01_architecture_norms/observability_standards.md"}
          - {relation: CONNESSA_A, node: "01_architecture_norms/coding_standards.md"}
    evidence: >-
      Misurato: 33 archi (23 out / 10 in). Il contratto degli errori eredita dai safeguard
      (gli errori nominati vengono da lì) ed è bidirezionalmente connesso a observability
      (il correlationId compare sia nel payload di errore sia nei log).
    answer_note: "Eredita dai safeguard; connesso a observability_standards e coding_standards."

  - q: "relazioni di testing_strategy.md"
    kind: structural
    target: "01_architecture_norms/testing_strategy.md"
    expected:
      retrieval:
        - {doc: testing_strategy}
      graph:
        intent: relazioni
        relations:
          - {relation: EREDITA_VINCOLI, node: "00_meta_governance/safeguards_security.md"}
          - {relation: CONNESSA_A, node: "00_meta_governance/definition_of_done.md"}
          - {relation: CONNESSA_A, node: "04_knowledge_informative/vibe_coding_workflow.md"}
    evidence: >-
      Misurato: 33 archi (23 out / 10 in). La strategia di test eredita dai safeguard
      (deve dimostrarne l'enforcement) ed è connessa alla Definition of Done, che ne
      consuma le voci nella checklist di livello funzionalità.
    answer_note: "Eredita dai safeguard; connessa a definition_of_done e vibe_coding_workflow."

  - q: "cosa impatta observability_standards.md?"
    kind: structural
    target: "01_architecture_norms/observability_standards.md"
    expected:
      retrieval:
        - {doc: observability_standards}
      graph:
        intent: impatto
        nodes:
          - "00_meta_governance/safeguards_security.md"
          - "01_architecture_norms/api_error_contract.md"
    evidence: >-
      Misurato: 82 nodi in 2 anelli (31 / 51). Il primo anello raggiunge già safeguards
      (da cui eredita il vincolo PII) e api_error_contract (con cui condivide il
      correlationId).
    answer_note: "Impatta il contratto API e tocca il perimetro dei safeguard sulla privacy."

  # ───────────────────────────── MULTIHOP ─────────────────────────────

  - q: "dove finisce il correlation id di una richiesta e chi lo impone?"
    kind: multihop
    expected:
      retrieval:
        - {doc: observability_standards, section: "Log Strutturati e Correlazione"}
        - {doc: api_error_contract, section: "Forma dell'Errore"}
        - {doc: safeguards_security, section: "Immutabilità"}
    evidence: >-
      Tre documenti: OBS-03 impone la propagazione end-to-end, API-01 ne impone la
      presenza nel payload di errore, AUD-02 lo richiede nel record di audit. Nessun
      chunk singolo li contiene tutti.
    answer_note: >-
      Log, span di tracing, messaggi su coda, record di audit e risposte di errore: la
      propagazione è imposta da REGOLA-OBS-03, il payload di errore da REGOLA-API-01.

  - q: "quali vincoli valgono sui dati personali fra log, test e chiamate a LLM esterni?"
    kind: multihop
    expected:
      retrieval:
        - {doc: safeguards_security, section: "Privacy e Confine"}
        - {doc: observability_standards, section: "Confine di Privacy"}
        - {doc: testing_strategy, section: "Gate di Qualità"}
    evidence: >-
      SAFEGUARD-SEC-04 fissa il confine, REGOLA-OBS-06 lo realizza con il sanitizer nel
      logger, REGOLA-TEST-09 lo estende ai dati di test. Catena su tre documenti distinti.
    answer_note: >-
      Il confine local-first di SEC-04 vale ovunque: sanitizer nel logger, scrubbing sugli
      APM, dati di test sintetici e nessun PII reale nel contesto inviato a un LLM remoto.

  - q: "come si implementa e come si verifica la protezione sull'ultima unità disponibile?"
    kind: multihop
    expected:
      retrieval:
        - {doc: safeguards_security, section: "Concorrenza Critica"}
        - {doc: testing_strategy, section: "Tracciabilità fra Regole e Test"}
        - {doc: api_error_contract, section: "Status HTTP"}
    evidence: >-
      TXN-01 impone il lock, TXN-04 impone l'errore deterministico al perdente, TEST-04
      impone che la verifica usi transazioni realmente parallele, API-04 fissa il 409.
      Implementazione, verifica e contratto stanno in tre documenti diversi.
    answer_note: >-
      Lock pessimistico prima della lettura, decremento e audit nella stessa transazione,
      409 RESOURCE_EXHAUSTED al perdente, test con transazioni davvero concorrenti.

  - q: "qual è la differenza fra il giornale di audit e i log applicativi?"
    kind: multihop
    expected:
      retrieval:
        - {doc: observability_standards, section: "Audit Log"}
        - {doc: safeguards_security, section: "Immutabilità"}
    evidence: >-
      REGOLA-OBS-01 stabilisce che sono sistemi distinti e non sostituibili; i requisiti
      opposti (scrittura sincrona e perdita mai ammessa) vengono da AUD-01 e AUD-02.
    answer_note: >-
      L'audit è append-only, sincrono nella transazione e non può perdersi; il log
      applicativo è asincrono, diagnostico e tollera perdita. Nessuno dei due sostituisce
      l'altro.

  - q: "come faccio a sapere se una funzionalità è davvero finita?"
    kind: multihop
    expected:
      retrieval:
        - {doc: definition_of_done, section: "Livello Funzionalità"}
        - {doc: vibe_coding_workflow, section: "Human-in-the-Loop"}
    evidence: >-
      REGOLA-HITL-05 blocca il sign-off in attesa della checklist di conformità, che vive
      in definition_of_done. La risposta richiede entrambi: il checkpoint e il suo contenuto.
    answer_note: >-
      Quando la checklist di livello funzionalità è soddisfatta con evidenze verificabili
      e il sign-off di HITL-05 è stato dato in modo esplicito.

  - q: "come si collega una regola documentata al codice che la implementa e al test che la verifica?"
    kind: multihop
    expected:
      retrieval:
        - {doc: coding_standards, section: "Tracciabilità della Governance"}
        - {doc: testing_strategy, section: "Tracciabilità fra Regole e Test"}
    evidence: >-
      REGOLA-CLEAN-03 impone il tag nel docstring per lo scanner AST; REGOLA-TEST-03
      impone che anche il test dichiari il tag della norma verificata. La catena
      regola→codice→test attraversa due documenti.
    answer_note: >-
      Con il tag [REGOLA-*] nel docstring della funzione e nel test corrispondente: è
      l'arco IMPLEMENTS del grafo a chiudere la tracciabilità bidirezionale.

  - q: "cosa devo fare quando modifico un documento della knowledge base?"
    kind: multihop
    expected:
      retrieval:
        - {doc: policy_versionamento_documentale, section: "Regole di Gestione delle Versioni"}
        - {doc: spec_graph_rag_ingestion, section: "Aggiornamento Incrementale"}
    evidence: >-
      REGOLA-DEV-03 impone il bump nello stesso commit; REGOLA-VAL-09 è il meccanismo che
      lo fa rispettare bloccando la pipeline con VERSION_NOT_BUMPED. Policy e enforcement
      stanno in documenti diversi.
    answer_note: >-
      Incrementare `version` nello stesso commit del corpo e registrare la riga nel
      registro; senza bump l'ingestion incrementale rigetta il documento.

  - q: "perché non posso scrivere un colore direttamente in un componente?"
    kind: multihop
    expected:
      retrieval:
        - {doc: ui_ux_brand_directives, section: "Design Token"}
        - {doc: coding_standards, section: "Metriche Strutturali"}
    evidence: >-
      REGOLA-UI-01 è dichiarata esplicitamente corollario di REGOLA-CLEAN-05 (divieto di
      magic number): la motivazione completa richiede entrambi i documenti.
    answer_note: >-
      Perché è un magic number applicato al livello visivo: viola REGOLA-UI-01 come
      corollario di REGOLA-CLEAN-05, e rende impossibile cambiare il tema in un punto solo.
