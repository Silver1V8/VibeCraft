      2.  **Soglia di blocco dell'ingestion (`<<SOGLIA_CHUNK_ASSOLUTA>>`):**
          *   **Valore:** `2500` caratteri *(default)*.
          *   **Vincolo:** Al superamento di questa soglia, l'indicizzatore blocca l'ingestion.
          *   **Severità dello sforamento:** `WARNING`.
          *   **Fonte:** `[REGOLA-VAL-06]` in `02_specs_normative/spec_graph_rag_ingestion.md § 2. Requisiti di Chunking Dinamico e Compressione [REQUIREMENTS]`, confermato anche nel riepilogo dei parametri in `02_specs_normative/spec_graph_rag_ingestion.md § 1. Obiettivo e Ambito di Applicazione [REQUIREMENTS]`.

      **Nota sulla divergenza:**
      Il blocco `04_knowledge_informative/graph_rag_ingestion_strategy.md` descrive il valore empirico scelto (`~1500`) come la soglia oltre la quale BGE-M3 perde precisione, e menziona che `2500` è il punto oltre il quale si preferisce bloccare l'ingestion con severity `WARNING`. Questo valore coincide esattamente con i parametri definiti nelle specifiche normative (`<<SOGLIA_CHUNK>>` = 1500, `<<SOGLIA_CHUNK_ASSOLUTA>>` = 2500). Non vi è divergenza tra codice e documento su questi valori numerici specifici.
