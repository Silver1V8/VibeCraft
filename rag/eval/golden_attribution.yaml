      1.  **Soglia operativa (`<<SOGLIA_CHUNK>>`):**
          *   **Valore:** `1500` caratteri *(default)*.
          *   **Vincolo:** La segmentazione deve produrre blocchi semantici sotto questo limite per preservare la densità informativa.
          *   **Severità dello sforamento:** Non è esplicitamente definita una severità di blocco (come `WARNING`) per il superamento di questa soglia specifica nel contesto fornito; tuttavia, l'effetto in caso di violazione è descritto come **"Diluizione della firma semantica del vettore ed errori di accuratezza nel Dense Retrieval"**.
