    implementing_code_blocks: 10
    answer: |
      Il contesto non riporta un blocco specifico dell'ingestion legato a una "dimenticanza" generica, ma definisce esplicitamente la condizione e le conseguenze tecniche per il caso in cui il corpo del documento è modificato senza l'incremento contestuale del campo `version`.

      Secondo **[REGOLA-VAL-09]** (Version bump bloccante obbligatorio) presente nel file `02_specs_normative/spec_graph_rag_ingestion.md`, la modifica del corpo di un documento senza il contestuale incremento di `version` deve **bloccare la pipeline** con l'eccezione **`VERSION_NOT_BUMPED`**.

      Questa regola è rafforzata da **[REGOLA-DEV-03]** (Version bump contestuale alla modifica) nel file `00_meta_governance/policy_versionamento_documentale.md`, che specifica che un "bump differito produce una finestra in cui l'indice contiene chunk che non corrispondono più al file sorgente", portando la pipeline a **rigettare il documento** con **`VERSION_NOT_BUMPED`**.

      Il contesto conferma inoltre, tramite lo scenario Gherkin **"Blocco per modifica senza version bump"** nel file `00_meta_governance/policy_versionamento_documentale.md`, che quando viene lanciata la pipeline di ingestion incrementale su un documento modificato il cui campo `version` è rimasto invariato, **la pipeline si arresta sollevando `VERSION_NOT_BUMPED`** e l'indice resta sull'ultima versione coerente.

      Pertanto, ciò che blocca l'ingestion è la violazione del vincolo di atomicità tra modifica del corpo e incremento della versione, che attiva il blocco con l'eccezione **`VERSION_NOT_BUMPED`**.
