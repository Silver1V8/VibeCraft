  # ═══════════════════════════════════════════════════════════════════════════════════
  # CASI AVVERSARIALI SULL'AUTORITÀ (S5, ADR 0002 — aggiunti 2026-08-24)
  #
  # Marcati `adversarial: true`: eval/run.py li misura ANCHE come sottoinsieme a sé,
  # perché è il numero che il piano ADR 0002 deve muovere e la media coi casi facili lo
  # renderebbe invisibile.
  #
  # Cosa hanno di diverso dai 49 casi sopra: là la fonte attesa è anche la più simile
  # alla domanda, quindi il ranking semantico da solo basta e la recall satura. Qui la
  # domanda usa il vocabolario di una fonte a BASSA autorità (informativa METHODOLOGY
  # 0.50, o senza alcuna classificazione 0.30) mentre la risposta vincolante sta in una
  # fonte ad autorità ALTA che quel vocabolario non lo usa. Il ColBERT premia il
  # distrattore; solo l'autorità può correggere.
  #
  # VERIFICATI UNO PER UNO il 2026-08-24 contro il ranking di produzione (GET
  # /api/retrieve, corpus 26 documenti / 175 chunk, S1-S4 già in main): in TUTTI E DIECI
  # il distrattore precede la fonte attesa. Rango del distrattore -> rango dell'atteso:
  #   1->2, 1->2, 1->2, 1->2, 2->3, 1->3, 1->5, 3->5, 1->2, 1->3.
  # Un caso che il sistema già supera è stato SCARTATO: gonfierebbe la recall e
  # riprodurrebbe il difetto che questa sezione esiste per correggere. Scartati per
  # questa ragione, e annotati qui perché il fatto è informativo: "divieto di segreti
  # hardcoded", "checkpoint di sign-off umano finale", "unicità dell'ambiente
  # transazionale per il lock", "backoff multi-canale email slack", "architettura Server
  # Component e Client Component". Su questi cinque la fonte normativa vince già senza
  # aiuto dall'autorità.
  # Scartati invece per DISONESTÀ del caso (la fonte attesa non risponde davvero, quindi
  # il "fallimento" non sarebbe un difetto di ranking): "estrazione dei magic numbers"
  # e "isolamento delle regole di business" — coding_standards.md non tratta né l'una né
  # l'altra: la fonte corretta è proprio il documento informativo.
  #
  # NON costruibili su questo corpus, e la ragione va letta come un risultato:
  #   - ENFORCED vs ARCHIVED/DEPRECATED: nessun documento del corpus ha uno status
  #     diverso da ENFORCED. Zero su 26.
  #   - SUPERA_IN_PRIORITÀ (S4): l'unica dichiarazione del corpus
  #     (safeguards_security.md) ha per target `QUALSIASI_DECISIONE_IMPLEMENTATIVA_LOCALE`,
  #     che non è un documento: `precedence_pairs()` richiede che ENTRAMBI i capi siano
  #     doc_id presenti nei risultati, quindi nessuna coppia si forma mai.
  #   - "raggiungibile solo via grafo" (S3): la fase 6 di [REGOLA-WF-01] vive in /ask
  #     (api/routes_retrieval.py), non in /api/retrieve che è ciò che il golden set
  #     interroga. Non è misurabile da qui con nessun caso.
  # ═══════════════════════════════════════════════════════════════════════════════════

