  # ═══════════════════════════════════════════════════════════════════════════════════
  # CASI AVVERSARIALI SULL'AUTORITÀ (S5, ADR 0002 — aggiunti 2026-08-24)
  #
  # AGGIORNATO 2026-08-25 dopo il ripristino del baseline committato di docs/: i casi
  # avversariali sono passati da 10 a 9 (vedi l'annotazione sul caso della tracciabilità).
  #
  # Marcati `adversarial: true`: eval/run.py li misura ANCHE come sottoinsieme a sé,
  # perché è il numero che il piano ADR 0002 deve muovere e la media coi casi facili lo
  # renderebbe invisibile.
  #
  # Cosa hanno di diverso dai 49 casi sopra: là la fonte attesa è anche la più simile
  # alla domanda, quindi il ranking semantico da solo basta e la recall satura. Qui la
  # domanda usa il vocabolario di una fonte a BASSA autorità (informativa METHODOLOGY
  # 0.50, o senza alcuna classificazione 0.30) mentre la risposta vincolante sta in una
  # fonte ad autorità ALTA che quel vocabolario non lo usa. Il ColBERT premia il
  # distrattore; solo l'autorità può correggere.
  #
  # VERIFICATI UNO PER UNO il 2026-08-24 contro il ranking di produzione (GET
  # /api/retrieve, corpus 26 documenti / 175 chunk, S1-S4 già in main): in TUTTI E DIECI
  # il distrattore precede la fonte attesa. Rango del distrattore -> rango dell'atteso:
  #   1->2, 1->2, 1->2, 1->2, 2->3, 1->3, 1->5, 3->5, 1->2, 1->3.
  # Un caso che il sistema già supera è stato SCARTATO: gonfierebbe la recall e
  # riprodurrebbe il difetto che questa sezione esiste per correggere. Scartati per
  # questa ragione, e annotati qui perché il fatto è informativo: "divieto di segreti
  # hardcoded", "checkpoint di sign-off umano finale", "unicità dell'ambiente
  # transazionale per il lock", "backoff multi-canale email slack", "architettura Server
  # Component e Client Component". Su questi cinque la fonte normativa vince già senza
  # aiuto dall'autorità.
  # Due casi erano stati scartati come DISONESTI perché coding_standards.md non trattava
  # l'argomento: "estrazione dei magic numbers" e "isolamento delle regole di business".
  # Il giudizio era sbagliato, e la causa è la stessa del caso sui sinonimi: quelle due
  # regole sono [REGOLA-CLEAN-05] e [CLEAN-06], presenti nel baseline committato e assenti
  # dalla copia di lavoro che il RAG indicizzava. Ripristinato il baseline (2026-08-25)
  # sono tornate al loro posto, quindi i due casi sarebbero oggi costruibili: non sono
  # stati aggiunti qui, ma non vanno più considerati disonesti.
  #
  # NON costruibili su questo corpus, e la ragione va letta come un risultato:
  #   - ENFORCED vs ARCHIVED/DEPRECATED: nessun documento del corpus ha uno status
  #     diverso da ENFORCED. Zero su 26.
  #   - SUPERA_IN_PRIORITÀ (S4): l'unica dichiarazione del corpus
  #     (safeguards_security.md) ha per target `QUALSIASI_DECISIONE_IMPLEMENTATIVA_LOCALE`,
  #     che non è un documento: `precedence_pairs()` richiede che ENTRAMBI i capi siano
  #     doc_id presenti nei risultati, quindi nessuna coppia si forma mai.
  #   - "raggiungibile solo via grafo" (S3): la fase 6 di [REGOLA-WF-01] vive in /ask
  #     (api/routes_retrieval.py), non in /api/retrieve che è ciò che il golden set
  #     interroga. Non è misurabile da qui con nessun caso.
  # ═══════════════════════════════════════════════════════════════════════════════════

  # ── distrattore: 04_knowledge_informative/graph_rag_ingestion_strategy.md (METHODOLOGY, peso 0.50)
  #    Il documento dichiara di sé «non contiene regole enforceable e non deve essere
  #    citato come fonte di un vincolo»: chiedere la regola e attendersi la spec non è
  #    una convenzione nostra, è scritto nel corpus.
  - q: "cosa blocca l'ingestion quando qualcuno dimentica il bump di versione del documento"
    adversarial: true
    expected:
      - {doc: spec_graph_rag_ingestion, section: "Aggiornamento Incrementale"}

  - q: "quanti caratteri al massimo può avere un chunk e con quale severità viene segnalato lo sforamento"
    adversarial: true
    expected:
      - {doc: spec_graph_rag_ingestion, section: "Chunking"}

  - q: "in quale ordine il chunker tenta i tagli: blocchi atomici, poi H2, poi H3, poi paragrafi"
    adversarial: true
    expected:
      - {doc: spec_graph_rag_ingestion, section: "Chunking"}

  # ── NON PIÙ AVVERSARIALE dal 2026-08-25, e la ragione è il punto.
  #    Lo era perché vibe_coding_workflow.md v1.0.0 ridefiniva [REGOLA-CLEAN-*] con una
  #    numerazione propria e collidente: stesso vocabolario, metà autorità, e vinceva il
  #    match lessicale. Ripristinato il baseline committato, la v2.0.0 non duplica più
  #    quegli identificatori (rimanda a coding_standards.md) e la collisione non esiste:
  #    l'atteso è ora a rango 1, il distrattore a 3. Il sistema lo supera, quindi il
  #    marcatore `adversarial` è stato TOLTO — un caso che passa gonfierebbe la recall del
  #    sottoinsieme e riprodurrebbe il difetto che S5 esiste per correggere. Resta come
  #    caso normale: la domanda è legittima e la fonte attesa è quella giusta.
  - q: "tracciabilità bidirezionale nei commenti fra riga di codice e regola di business"
    expected:
      - {doc: coding_standards, section: "Tracciabilità della Governance"}

  # ── distrattore: 04_knowledge_informative/intent_synonym_mapping.md (METHODOLOGY, peso 0.50)
  #    È il documento scritto APPOSTA in gergo colloquiale per fare da ponte fra il
  #    linguaggio naturale e il modello dati: per costruzione vince il match lessicale
  #    su qualunque domanda posta come la porrebbe un utente.
  - q: "posso mandare la motivazione scritta dal dipendente a un LLM remoto"
    adversarial: true
