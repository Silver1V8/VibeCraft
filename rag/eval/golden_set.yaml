# Golden-set di retrieval — misura oggettiva della qualità del ranking.
#
# Ogni caso ha una domanda (`q`) e le SORGENTI ATTESE (`expected`): i chunk/sezioni o i
# file che dovrebbero comparire tra i primi risultati. `expected` è una lista di matcher;
# per superare recall@k bastano i matcher trovati entro i primi k risultati.
#
# Un matcher può essere una stringa (sottostringa cercata in chunk_id O doc_id) oppure un
# dict con chiavi (tutte in AND, confronto per sottostringa case-insensitive):
#   doc     : sottostringa del doc_id padre (es. "safeguards_security")
#   section : sottostringa della sezione — deve corrispondere a un heading `##` reale
#   chunk   : sottostringa del chunk_id (es. "safeguards_security.md#01")
#   file    : sottostringa di chunk_id o doc_id (utile per attese a livello di file sorgente)
#
# Il vecchio formato `expected_doc` + `expected_section` è ancora accettato (retrocompat).
#
# ─────────────────────────────────────────────────────────────────────────────────────
# RISCRITTO 2026-07-22 sul corpus cross-progetto (11 documenti).
#
# Il golden-set precedente (34 casi) era costruito sul dominio "prenotazione eventi
# aziendali": 24 casi su 34 puntavano a documenti poi rimossi (glossario_entita,
# matrice_permessi, intent_synonym_mapping, le spec funzionali). Le domande non sono
# state tradotte ma RISCRITTE: i concetti interrogati (workflow richieste, RBAC, budget
# formativo) non esistono più nel corpus, quindi tradurle avrebbe prodotto attese
# arbitrarie. Lo storico in eval/results/history.jsonl precedente a questa data NON è
# confrontabile coi numeri prodotti da questo file: è cambiato il corpus, non i casi.
#
# Copertura: tutti gli 11 documenti della baseline compaiono in almeno un caso.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# RIMOSSI 4 CASI AVVERSARIALI il 2026-08-25 — la recidiva del difetto qui sopra.
#
# I 10 casi avversariali di S5 (ADR 0002) sono stati scritti quando docs/ conteneva 26
# documenti sul disco ma la baseline committata ne aveva 11: l'ADR li dichiara misurati
# «sul corpus committato (26 documenti)», e non lo erano. Ripristinata la baseline
# (c54030f), 4 di quei casi puntavano a documenti che vivono solo in locale —
# matrice_permessi e glossario_entita, cioè DUE DEI NOMI che la nota del 2026-07-22 qui
# sopra elenca già come rimossi, più spec_tech_frontend. Verdi in locale, rossi in CI:
# è la divergenza docs/<->git che rendeva la misura non riproducibile.
#
# Rimossi e non tradotti, per la stessa ragione del 2026-07-22: i concetti interrogati
# (pratiche d'autorità, cassa formativa, capienza eventi, stack frontend) non esistono
# nella baseline, quindi tradurli produrrebbe attese arbitrarie. Restano 5 casi
# avversariali su 9.
#
# APERTO: dei 5 superstiti, alcuni dichiarano nei commenti un distrattore che è anch'esso
# fuori dalla baseline (intent_synonym_mapping.md, 03_changes_historical/*-canvas-review.md).
# L'atteso esiste, quindi il test passa, ma il contrasto avversariale è esercitato solo
# dove il corpus locale è completo. Va rimisurato, non assunto.
# ─────────────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────────────
