# VibeCraft — stack completo. Tre profili, perche' "gira ovunque" ha un asterisco.
#
#   docker compose --profile cpu up -d          # ovunque, anche senza GPU
#   docker compose --profile gpu up -d          # NVIDIA + nvidia-container-toolkit
#   docker compose --profile host-ollama up -d  # Ollama nativo sull'host (macOS)
#
# Qdrant non ha profilo: serve a tutti e tre.
#
# PERCHE' UN PROFILO PER macOS. Docker su macOS non espone Metal, quindi un modello da 9B
# dentro un container gira su CPU. Il percorso sensato li' e' Ollama NATIVO (che usa Metal)
# e il container che gli punta contro: e' quello che fa `host-ollama`.
#
# VINCOLO DA NON IGNORARE (rag/DISTRIBUTION.md). Il server carica l'embedder su CPU DI
# PROPOSITO (api/deps.py): 8 GB di VRAM non tengono bge-m3 e qwen3.5:9b residenti insieme.
# Nel profilo `gpu` la GPU e' assegnata sia all'app (che la usa per i job di reindex in
# batch) sia a Ollama: su una scheda da 8 GB le due cose si contendono la memoria durante
# una reindicizzazione. Non e' un difetto del compose, e' il vincolo dell'hardware — su
# schede piccole conviene reindicizzare quando non si sta interrogando.

services:

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    # Porta esposta solo su localhost, coerente con il default 127.0.0.1 del server RAG.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Autenticazione Qdrant DISATTIVATA di default (setup locale keyless).
    # NB: Qdrant tratta una stringa VUOTA come "chiave attiva ma vuota" e rifiuta
    # tutte le richieste — quindi la chiave va passata SOLO se davvero valorizzata.
    # Per abilitarla: esporta QDRANT_API_KEY (e imposta lo stesso valore in
    # QDRANT_API_KEY per il server RAG), poi decommenta il blocco sotto.
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  # ─────────────────────────────────────────────────────────────────────────
  # Ollama — in container nei profili cpu/gpu, sull'host nel profilo host-ollama
  # ─────────────────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      # I 6,6 GB di qwen3.5:9b vivono qui e sopravvivono a ogni aggiornamento dell'immagine.
      - ollama_models:/root/.ollama

  ollama-gpu:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────────────────
  # L'applicazione — stesso codice, tre modi di eseguirla
  # ─────────────────────────────────────────────────────────────────────────

  app-cpu:
    profiles: ["cpu"]
    build:
      context: .
      target: cpu
    image: vibecraft:cpu
    restart: unless-stopped
    depends_on: [qdrant, ollama]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # OBBLIGATORIA in Docker, e compose si rifiuta di partire senza. Non e' pignoleria:
      # il server esenta dall'autenticazione solo i client che si presentano come 127.0.0.1,
      # e attraverso il port forwarding le richieste arrivano dal gateway del bridge. Senza
      # una chiave CONFIGURATA SUL SERVER, _valid_api_key e' falsa per costruzione: la
      # console chiederebbe una chiave che nessun valore puo' soddisfare.
      # Generane una e mettila in un file .env alla root (compose lo legge da solo):
      #   python -c "import secrets; print('VIBECRAFT_API_KEY=' + secrets.token_urlsafe(32))" > .env
      VIBECRAFT_API_KEY: ${VIBECRAFT_API_KEY:?manca VIBECRAFT_API_KEY — generala in un file .env alla root del repository, vedi README}
      VIBECRAFT_LOG_LEVEL: ${VIBECRAFT_LOG_LEVEL:-INFO}
    volumes:
      - vibecraft_index:/app/rag/database     # artefatti dell'indice (blue/green)
      - vibecraft_models:/models/huggingface  # bge-m3, 4,3 GB, scaricato al primo avvio
      # Per indicizzare i TUOI documenti al posto del corpus di esempio, e per far vedere
      # al sistema il codice di un progetto vero, scommenta e adatta:
      #- ./docs:/app/docs
      #- ./code:/app/code

  app-gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: gpu
    image: vibecraft:gpu
    restart: unless-stopped
    depends_on: [qdrant, ollama-gpu]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Obbligatoria: vedi la nota estesa sul servizio app-cpu.
      VIBECRAFT_API_KEY: ${VIBECRAFT_API_KEY:?manca VIBECRAFT_API_KEY — generala in un file .env alla root del repository, vedi README}
      VIBECRAFT_LOG_LEVEL: ${VIBECRAFT_LOG_LEVEL:-INFO}
      VIBECRAFT_OLLAMA_URL: http://ollama-gpu:11434
    volumes:
      - vibecraft_index:/app/rag/database
      - vibecraft_models:/models/huggingface
      #- ./docs:/app/docs
      #- ./code:/app/code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app-host-ollama:
    profiles: ["host-ollama"]
    build:
      context: .
      target: cpu
    image: vibecraft:cpu
    restart: unless-stopped
    depends_on: [qdrant]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Obbligatoria: vedi la nota estesa sul servizio app-cpu.
      VIBECRAFT_API_KEY: ${VIBECRAFT_API_KEY:?manca VIBECRAFT_API_KEY — generala in un file .env alla root del repository, vedi README}
      VIBECRAFT_LOG_LEVEL: ${VIBECRAFT_LOG_LEVEL:-INFO}
      # Ollama gira sull'host (nativo, con Metal su macOS): il container lo raggiunge qui.
      VIBECRAFT_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # Su Docker Desktop (macOS/Windows) host.docker.internal esiste gia'; su Linux no,
      # e questa riga lo fa risolvere all'indirizzo del gateway.
      - "host.docker.internal:host-gateway"
    volumes:
      - vibecraft_index:/app/rag/database
      - vibecraft_models:/models/huggingface
      #- ./docs:/app/docs
      #- ./code:/app/code

volumes:
  qdrant_storage:
  ollama_models:
  vibecraft_index:
  vibecraft_models:
