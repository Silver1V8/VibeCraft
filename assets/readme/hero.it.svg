<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="RAG generico contro VibeCraft: il RAG generico cita la metodologia perché somiglia di più alla domanda (0,86); VibeCraft moltiplica per il peso di autorità e cita la specifica che stabilisce la regola (0,80 contro 0,73).">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #e8fff0; }
    .ask { font-size: 14px; fill: #00ff41; fill-opacity: .85; }
    .ptitle { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; }
    .psub { font-size: 12.5px; fill: #7f9a88; }
    .rank { font-size: 22px; font-weight: 700; }
    .file { font-size: 15px; fill: #d8f5e0; }
    .tag { font-size: 12px; fill: #6f8f7a; }
    .score { font-size: 20px; font-weight: 700; }
    .verdict { font-size: 12px; font-weight: 700; }
    .formula { font-size: 16px; fill: #c9f7d6; }
    .note { font-size: 11.5px; fill: #5f7d69; }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#0c2616" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="18" fill="#04140a" stroke="#0f3d20"/>
  <rect x="0.5" y="0.5" width="879" height="399" rx="18" fill="url(#grid)" opacity=".55"/>

  <text x="440" y="46" text-anchor="middle" class="sans title">Chi spiega la regola non è chi la stabilisce.</text>
  <text x="440" y="74" text-anchor="middle" class="mono ask">› Chi può approvare una prenotazione oltre il budget?</text>

  <!-- RAG generico -->
  <rect x="30" y="96" width="400" height="214" rx="12" fill="#06190d" stroke="#16301f"/>
  <text x="50" y="122" class="sans ptitle" fill="#8aa293">RAG GENERICO</text>
  <text x="50" y="141" class="sans psub">vince il testo che somiglia di più</text>

  <rect x="46" y="156" width="368" height="64" rx="9" fill="#1a1406" stroke="#ffb020" stroke-opacity=".8"/>
  <text x="66" y="196" class="sans rank" fill="#ffb020">1</text>
  <text x="94" y="183" class="mono file">metodologia.md</text>
  <text x="94" y="204" class="mono tag">METHODOLOGY · peso 0,50</text>
  <text x="398" y="186" text-anchor="end" class="mono score" fill="#ffb020">0,86</text>
  <text x="398" y="206" text-anchor="end" class="sans verdict" fill="#ffb020">✗ citata</text>

  <rect x="46" y="232" width="368" height="64" rx="9" fill="#071a0e" stroke="#1d3b28"/>
  <text x="66" y="272" class="sans rank" fill="#5f7d69">2</text>
  <text x="94" y="259" class="mono file">spec_prenotazioni.md</text>
  <text x="94" y="280" class="mono tag">IRON_MEMORY · peso 1,00</text>
  <text x="398" y="262" text-anchor="end" class="mono score" fill="#8aa293">0,80</text>

  <!-- VibeCraft -->
  <rect x="450" y="96" width="400" height="214" rx="12" fill="#06190d" stroke="#1d5c33"/>
  <text x="470" y="122" class="sans ptitle" fill="#00ff41">VIBECRAFT</text>
  <text x="470" y="141" class="sans psub">vince il testo che stabilisce la regola</text>

  <rect x="466" y="156" width="368" height="64" rx="9" fill="#062612" stroke="#00ff41" filter="url(#glow)"/>
  <text x="486" y="196" class="sans rank" fill="#00ff41">1</text>
  <text x="514" y="183" class="mono file">spec_prenotazioni.md</text>
  <text x="514" y="204" class="mono tag">0,80 × 1,00</text>
  <text x="818" y="186" text-anchor="end" class="mono score" fill="#00ff41">0,80</text>
  <text x="818" y="206" text-anchor="end" class="sans verdict" fill="#00ff41">✓ citata</text>

  <rect x="466" y="232" width="368" height="64" rx="9" fill="#071a0e" stroke="#1d3b28"/>
  <text x="486" y="272" class="sans rank" fill="#5f7d69">2</text>
  <text x="514" y="259" class="mono file">metodologia.md</text>
  <text x="514" y="280" class="mono tag">0,86 × 0,85</text>
  <text x="818" y="262" text-anchor="end" class="mono score" fill="#8aa293">0,73</text>

  <text x="440" y="346" text-anchor="middle" class="mono formula">punteggio = somiglianza × (1 − α + α · peso)   <tspan fill="#00ff41">α = 0,3</tspan></text>
  <text x="440" y="374" text-anchor="middle" class="sans note">Esempio illustrativo. Formula, α e pesi di classe sono quelli in produzione (rag/rag_config.yaml).</text>
</svg>
