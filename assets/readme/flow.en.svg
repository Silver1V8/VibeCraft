<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Two flows. /ask: question, hybrid dense and lexical retrieval, ColBERT rerank, authority multiplier, graph with path trust, answer with sources; structural questions go straight to the graph without the LLM. /pipeline: Explore, Canvas, Propose, Validate, Archive.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .row { font-size: 15px; font-weight: 700; fill: #00ff41; }
    .h { font-size: 13px; font-weight: 700; fill: #e8fff0; }
    .s { font-size: 10.5px; fill: #7f9a88; }
    .hl { fill: #00ff41; }
    .note { font-size: 11px; fill: #7f9a88; }
    .box { fill: #06190d; stroke: #1d3b28; }
    .on { fill: #062612; stroke: #00ff41; }
    .wire { stroke: #2f6b45; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2f6b45"/>
    </marker>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="289" rx="18" fill="#04140a" stroke="#0f3d20"/>

  <!-- /ask -->
  <text x="26" y="115" class="mono row">/ask</text>
  <path d="M166.5 78 V56 H674.5 V78" class="wire" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="420.5" y="47" text-anchor="middle" class="sans note">structural question → answered by the graph alone, no LLM</text>

  <rect x="110" y="80" width="113" height="60" rx="9" class="box"/>
  <text x="166.5" y="106" text-anchor="middle" class="sans h">Question</text>
  <text x="166.5" y="124" text-anchor="middle" class="sans s">free text</text>

  <rect x="237" y="80" width="113" height="60" rx="9" class="box"/>
  <text x="293.5" y="106" text-anchor="middle" class="sans h">Hybrid</text>
  <text x="293.5" y="124" text-anchor="middle" class="sans s">dense + lexical</text>

  <rect x="364" y="80" width="113" height="60" rx="9" class="box"/>
  <text x="420.5" y="106" text-anchor="middle" class="sans h">Rerank</text>
  <text x="420.5" y="124" text-anchor="middle" class="sans s">ColBERT</text>

  <rect x="491" y="80" width="113" height="60" rx="9" class="on" filter="url(#glow)"/>
  <text x="547.5" y="106" text-anchor="middle" class="sans h hl">× Authority</text>
  <text x="547.5" y="124" text-anchor="middle" class="sans s">declared weight</text>

  <rect x="618" y="80" width="113" height="60" rx="9" class="box"/>
  <text x="674.5" y="106" text-anchor="middle" class="sans h">Graph</text>
  <text x="674.5" y="124" text-anchor="middle" class="sans s">path trust</text>

  <rect x="745" y="80" width="113" height="60" rx="9" class="box"/>
  <text x="801.5" y="106" text-anchor="middle" class="sans h">Answer</text>
  <text x="801.5" y="124" text-anchor="middle" class="sans s">with cited sources</text>

  <g class="wire" marker-end="url(#a)">
    <path d="M223 110 H235"/>
    <path d="M350 110 H362"/>
    <path d="M477 110 H489"/>
    <path d="M604 110 H616"/>
    <path d="M731 110 H743"/>
  </g>

  <line x1="26" y1="170" x2="854" y2="170" stroke="#0f3d20"/>

  <!-- /pipeline -->
  <text x="26" y="233" class="mono row">/pipeline</text>

  <rect x="110" y="198" width="132" height="60" rx="9" class="box"/>
  <text x="176" y="224" text-anchor="middle" class="sans h">Explore</text>
  <text x="176" y="242" text-anchor="middle" class="sans s">interview</text>

  <rect x="264" y="198" width="132" height="60" rx="9" class="box"/>
  <text x="330" y="224" text-anchor="middle" class="sans h">Canvas</text>
  <text x="330" y="242" text-anchor="middle" class="sans s">rule-grounded draft</text>

  <rect x="418" y="198" width="132" height="60" rx="9" class="box"/>
  <text x="484" y="224" text-anchor="middle" class="sans h">Propose</text>
  <text x="484" y="242" text-anchor="middle" class="sans s">spec + Gherkin</text>

  <rect x="572" y="198" width="132" height="60" rx="9" class="on" filter="url(#glow)"/>
  <text x="638" y="224" text-anchor="middle" class="sans h hl">Validate</text>
  <text x="638" y="242" text-anchor="middle" class="sans s">contract gate</text>

  <rect x="726" y="198" width="132" height="60" rx="9" class="box"/>
  <text x="792" y="224" text-anchor="middle" class="sans h">Archive</text>
  <text x="792" y="242" text-anchor="middle" class="sans s">lessons learned</text>

  <g class="wire" marker-end="url(#a)">
    <path d="M242 228 H262"/>
    <path d="M396 228 H416"/>
    <path d="M550 228 H570"/>
    <path d="M704 228 H724"/>
  </g>
</svg>
