<div style="display:flex;flex-direction:column;gap:16px">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px">Budget consumato</p>
    <p style="font-size:22px;font-weight:500;margin:0;color:var(--text-primary)">€ 48.200</p>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px">Budget residuo</p>
    <p style="font-size:22px;font-weight:500;margin:0;color:var(--text-primary)">€ 31.800</p>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px">Saturazione media</p>
    <p style="font-size:22px;font-weight:500;margin:0;color:var(--text-primary)">68%</p>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem">
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px">Tasso approvazione</p>
    <p style="font-size:22px;font-weight:500;margin:0;color:var(--text-primary)">82%</p>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
  <div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;font-size:12px;color:var(--text-secondary)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#2a78d6"></span>Consumato 60%</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#e1e0d9"></span>Residuo 40%</span>
    </div>
    <div style="position:relative;width:100%;height:200px">
      <canvas id="donutBudget" role="img" aria-label="Grafico a ciambella della saturazione del budget formativo annuo: 60% consumato, 40% residuo">Budget formativo: 60% consumato, 40% residuo</canvas>
    </div>
  </div>
  <div>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px">Trend mensile richieste approvate</p>
    <div style="position:relative;width:100%;height:200px">
      <canvas id="trendChart" role="img" aria-label="Grafico a linee del trend mensile di richieste approvate da gennaio a giugno 2026">Trend: gen 8, feb 12, mar 15, apr 11, mag 18, giu 22</canvas>
    </div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('donutBudget'), {
  type: 'doughnut',
  data: {
    labels: ['Consumato', 'Residuo'],
    datasets: [{ data: [60, 40], backgroundColor: ['#2a78d6', '#e1e0d9'], borderWidth: 2, borderColor: '#fcfcfb' }]
  },
  options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { display: false } } }
});
new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: {
    labels: ['Gen','Feb','Mar','Apr','Mag','Giu'],
    datasets: [{ data: [8,12,15,11,18,22], borderColor: '#2a78d6', backgroundColor: 'rgba(42,120,214,0.1)', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#2a78d6', borderWidth: 2 }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { y: { beginAtZero: true, grid: { color: '#e1e0d9' } }, x: { grid: { display: false } } }
  }
});
</script>
