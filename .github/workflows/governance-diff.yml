name: Rilevamento autorità

# Rileva i cambi che alterano l'autorità effettiva. Non approva e non blocca il merge:
# se lo script esce 2, il passo stampa un warning ed esce 0. Vedi
# rag/eval/GOVERNANCE_APPROVAL.md.
#
# pull_request, non pull_request_target: il token resta in sola lettura e non si
# esegue il codice della PR con i permessi del branch base.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rilevamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Il rilevatore gira dal base, non dalla PR: una PR che modifica lo script non
      # deve poter decidere cosa lo script vede di se stessa.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base-detector
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.14"

      - name: PyYAML, nient'altro
        run: uv venv /tmp/gov && uv pip install --python /tmp/gov/bin/python "pyyaml==6.0.3"

      - name: Confronta base e head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f _base-detector/rag/scripts/governance_diff.py ]; then
            echo "::warning::Il base non ha ancora il rilevatore: non eseguo quello della PR."
            exit 0
          fi
          set +e
          /tmp/gov/bin/python _base-detector/rag/scripts/governance_diff.py --repo "$GITHUB_WORKSPACE" --git "$BASE_SHA" "$HEAD_SHA"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Cambiamenti che toccano l'autorità effettiva. Enforcement non attivo: il merge non è bloccato. Vedi rag/eval/GOVERNANCE_APPROVAL.md"
            exit 0
          fi
          exit "$code"
