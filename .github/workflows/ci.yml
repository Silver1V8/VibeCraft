name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.14"

      # Nessun servizio esterno: Qdrant/Ollama restano spenti. I test che toccano un
      # Qdrant reale (rag/tests/test_qdrant_blue_green.py) si auto-saltano con
      # pytest.skip quando la connessione fallisce — vedi rag/scripts/ci.sh.
      - name: Test suite (rag/)
        run: bash scripts/ci.sh
        working-directory: rag
