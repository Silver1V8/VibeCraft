name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Qdrant VERO, non un mock. La gran parte dei test del blue/green gira su
    # _FakeQdrant (in-memory), ma CINQUE sono di integrazione — alias swap,
    # delete-by-filter attraverso l'alias, invalidazione degli alias alla
    # delete_collection — e senza servizio si auto-saltavano SEMPRE qui: la semantica
    # reale di Qdrant era verificata solo da chi aveva Docker acceso in locale (A8).
    # Immagine pinnata come ogni altra versione di questo repo, e allineata al client
    # (qdrant-client==1.19.0 in uv.lock): un server piu' nuovo del client e' un'altra
    # variabile, e non e' quella che questo job vuole misurare.
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.14"

      # L'immagine Qdrant non dichiara una HEALTHCHECK, quindi "container avviato" non
      # significa "porta che risponde". Senza questa attesa una partenza lenta darebbe un
      # rosso intermittente che assomiglia a un difetto del codice.
      - name: Attendi che Qdrant risponda
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6333/readyz >/dev/null; then
              echo "Qdrant pronto: $(curl -s http://127.0.0.1:6333/ | head -c 200)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Qdrant non risponde su 127.0.0.1:6333 dopo 60s"
          docker ps -a
          exit 1

      # Docling (intake, PDF) va provato DAVVERO, non saltato: pesi alle revisioni
      # fissate e verificati per SHA-256 da scripts/docling_models.py, che esce 1 se un peso
      # manca o non corrisponde. La cache e' identificata dagli hash dei file che dichiarano
      # revisioni e SHA attesi: cambiarli invalida la cache, e i file recuperati vengono
      # comunque riverificati dallo stesso script. I pesi non stanno nel repository.
      - name: Librerie native di Docling (OpenCV, font per i PDF senza font incorporati)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxcb1 libgl1 libglib2.0-0 fonts-liberation libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui

      - name: Cache dei pesi Docling/RapidOCR
        uses: actions/cache@v5
        with:
          path: rag/database/models/docling
          key: docling-pesi-v2-${{ hashFiles('rag/core/intake_convert.py', 'rag/scripts/docling_models.py') }}

      - name: Pesi Docling alle revisioni fissate, verificati per SHA-256
        working-directory: rag
        run: uv run --frozen python scripts/docling_models.py

      # scripts/ci.sh gira anche ruff (selezione esplicita in pyproject.toml, A9)
      # prima della suite: lint e test nello stesso gate, stesso comando in locale.
      #
      # VIBECRAFT_REQUIRE_QDRANT=1 e' il gate del gate: dove il servizio e' DICHIARATO,
      # uno skip di quei cinque test non e' piu' "l'ambiente non ce l'ha", e
      # _real_qdrant_client_or_skip solleva invece di saltare. Senza, un job verde che
      # salta tutto sarebbe indistinguibile da un job verde che verifica — cioe'
      # esattamente lo stato di prima. ci.sh passa -rs, quindi ogni skip residuo compare
      # nel log col suo motivo e non solo come numero in fondo.
      - name: Lint + test suite (rag/), con Qdrant reale
        run: bash scripts/ci.sh
        working-directory: rag
        env:
          QDRANT_URL: http://127.0.0.1:6333
          VIBECRAFT_REQUIRE_QDRANT: "1"
          # Stesso patto di Qdrant: senza pesi i test con Docling reale FALLISCONO invece
          # di saltare (tests/test_intake_docling.py, fixture docling_reale).
          VIBECRAFT_REQUIRE_DOCLING: "1"
          # Idem per LibreOffice (DOC, PPT): tests/test_intake_libreoffice.py, fixture libreoffice_reale.
          VIBECRAFT_REQUIRE_LIBREOFFICE: "1"

      - name: Preview Excel - coordinate, caratteri letterali e HTML non eseguibile
        run: node rag/tests/intake_excel_preview.cjs

      - name: Fedeltà Excel - nessuna fusione di tabelle indipendenti
        working-directory: rag
        run: uv run --frozen pytest tests/test_intake_excel.py -k tabelle_affiancate_e_sovrapposte_restano_distinte

      # Il conteggio, in chiaro e in cima al riepilogo del run: -rs rende VISIBILE uno
      # skip, questo passo rende visibile che i cinque sono PASSATI. Sono i due lati
      # della stessa regressione, e leggere un numero costa meno che rileggere un log.
      - name: Conta i test d'integrazione davvero eseguiti
        working-directory: rag
        env:
          QDRANT_URL: http://127.0.0.1:6333
          VIBECRAFT_REQUIRE_QDRANT: "1"
        run: |
          uv run pytest tests/test_qdrant_blue_green.py -rs -k "real_qdrant" >/tmp/integrazione.txt 2>&1 || true
          cat /tmp/integrazione.txt
          if ! grep -qE "^5 passed" /tmp/integrazione.txt; then
            echo "::error::attesi 5 test d'integrazione PASSATI contro Qdrant reale"
            exit 1
          fi
          echo "### Qdrant reale: 5/5 test d'integrazione passati" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Il gate che mancava: un CHECKOUT PULITO deve poter produrre un'immagine che parte.
  # La suite sopra prova il codice; questo prova la DISTRIBUZIONE — che e' cio' che
  # rompe piu' facilmente, perche' sulla macchina di sviluppo funziona sempre.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # I runner hanno ~14 GB liberi. Questi alberi non servono qui e ne liberano diversi:
      # e' la causa piu' probabile di un "no space left on device" durante il build.
      - name: Libera spazio sul runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Immagine CPU da un checkout pulito
        run: docker build --target cpu -t vibecraft:cpu .

      # Prova che il venv costruito nello stage delle dipendenze e' utilizzabile e che il
      # grafo degli import regge: importare server costruisce l'intera app FastAPI.
      - name: L'applicazione importa dentro l'immagine
        run: docker run --rm vibecraft:cpu python -c "import server, index"

      # Conversioni REALI nell'immagine costruita: librerie native, font e pesi montati come
      # in compose (volume dell'indice). Stessa cache del job test: nessun download doppio
      # quando e' gia' popolata; se non lo e', lo scarica l'immagine stessa con lo script.
      - name: Cache dei pesi Docling/RapidOCR
        uses: actions/cache@v5
        with:
          path: rag/database/models/docling
          key: docling-pesi-v2-${{ hashFiles('rag/core/intake_convert.py', 'rag/scripts/docling_models.py') }}

      - name: Conversioni nell'immagine - PDF digitale, scansione con OCR, DOC, PPT, XLSX e XLS
        run: |
          mkdir -p rag/database/models/docling && chmod -R a+rwX rag/database/models
          pesi="$PWD/rag/database/models/docling:/app/rag/database/models/docling"
          # I metadati HF possono essere 0600: devono appartenere al runner che salva la cache.
          docker run --rm --user "$(id -u):$(id -g)" -v "$pesi" vibecraft:cpu python scripts/docling_models.py
          docker run --rm -i -v "$pesi" -v "$PWD/rag/tests/fixtures/intake:/fix:ro" vibecraft:cpu python - <<'PY'
          import io
          from pathlib import Path
          import openpyxl
          import pypdfium2 as pdfium
          from core.intake_convert import convert_to_markdown
          pdf = Path("/fix/tabelle_titoli.pdf").read_bytes()
          r = convert_to_markdown(pdf, "pdf", filename="t.pdf")
          assert r.metadata["motore"] == "docling" and r.metadata["fallback"] is None, r.metadata
          assert "#### Note operative" in r.markdown and "| L-02" in r.markdown, r.markdown
          img = pdfium.PdfDocument(pdf)[0].render(scale=150 / 72).to_pil().convert("L")
          buf = io.BytesIO()
          img.save(buf, format="PDF", resolution=150)
          s = convert_to_markdown(buf.getvalue(), "pdf", filename="s.pdf")
          assert s.metadata["pdf"]["ocr"] and s.metadata["fallback"] is None and "Beta SpA" in s.markdown, s.metadata
          for nome, fmt in (("legacy.doc", "doc"), ("legacy.ppt", "ppt")):
              r = convert_to_markdown(Path(f"/fix/{nome}").read_bytes(), fmt, filename=nome)
              assert r.metadata["normalizzazione"]["motore"] == "libreoffice" and r.metadata["motore"] == "markitdown", r.metadata
          # Excel: lettura diretta, niente LibreOffice. Riga con celle vuote intermedie intera.
          wb = openpyxl.Workbook()
          wb.active.title = "Budget"
          for riga in (["Voce", "Stato", "Quantità", "Data", "Importo", "Quota"], ["A", "NA"], [], ["Residuo", None, 10, None, 1500.5, 2401]):
              wb.active.append(riga)
          buf = io.BytesIO()
          wb.save(buf)
          x = convert_to_markdown(buf.getvalue(), "xlsx", filename="b.xlsx")
          assert x.metadata["motore"] == "openpyxl" and "## Budget" in x.markdown, x.metadata
          assert "| 4 | Residuo |  | 10 |  | 1500.5 | 2401 |" in x.markdown, x.markdown
          r = convert_to_markdown(Path("/fix/legacy.xls"), "xls")
          assert r.metadata["motore"] == "xlrd" and "normalizzazione" not in r.metadata, r.metadata
          assert "| 7 | Totale |  | 10 |  | 1500.5 | 2401 |" in r.markdown, r.markdown
          # Stesso workbook salvato da Excel nei due formati: stesso Markdown.
          assert (convert_to_markdown(Path("/fix/casi_excel.xls"), "xls").markdown
                  == convert_to_markdown(Path("/fix/casi_excel.xlsx"), "xlsx").markdown)
          print("Nell'immagine: PDF, OCR, DOC e PPT via LibreOffice; XLSX e XLS diretti ok")
          PY

      # Il preflight deve FALLIRE quando i servizi non ci sono — e deve dire come rimediare.
      # Un doctor che esce 0 a Qdrant spento non sta diagnosticando niente.
      - name: Il preflight segnala i servizi assenti, col rimedio
        run: |
          set +e
          uscita=$(docker run --rm vibecraft:cpu python scripts/doctor.py)
          codice=$?
          echo "$uscita"
          if [ "$codice" -ne 1 ]; then
            echo "::error::atteso exit 1 senza servizi attivi, ottenuto $codice"
            exit 1
          fi
          if ! echo "$uscita" | grep -q "docker compose up -d qdrant"; then
            echo "::error::il preflight non ha stampato il rimedio per Qdrant"
            exit 1
          fi

      - name: docker-compose valido in tutti e tre i profili
        run: |
          for profilo in cpu gpu host-ollama; do
            VIBECRAFT_API_KEY=chiave-di-ci docker compose --profile "$profilo" config >/dev/null
          done

      # In Docker il browser non arriva al server come 127.0.0.1, quindi senza una chiave
      # CONFIGURATA la console chiederebbe un valore che nulla puo' soddisfare. compose
      # deve rifiutarsi di partire, non consegnare quella configurazione.
      - name: compose rifiuta una configurazione senza API key
        run: |
          if docker compose --profile cpu config >/dev/null 2>&1; then
            echo "::error::compose ha accettato di partire senza VIBECRAFT_API_KEY"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # N6 — l'installazione nativa su macOS era verificata solo con
  # `uv sync --frozen --dry-run --python-platform aarch64-apple-darwin` (A15): quel
  # comando prova la RISOLUZIONE e la compatibilita' delle wheel — cio' che era
  # davvero rotto — non che torch poi giri. I runner macOS ARM lo provano davvero.
  #
  # SEPARATO dal job `test` di proposito: qui non servono ne' il corpus ne' i servizi,
  # e il ciclo principale non deve aspettare un runner macOS per dire se il codice e' ok.
  #
  # Gira su OGNI push, come gli altri due. Era stato limitato a main + workflow_dispatch
  # su una stima di costo che la misura ha smentito: prevedevo ~5-8 minuti reali (il grafo
  # delle dipendenze da scaricare) cioe' ~50-80 fatturati col moltiplicatore 10x dei runner
  # macOS su repository privato. Il primo run reale: **34 secondi**, ~6 minuti fatturati —
  # contro i 2m31s del job `test` e i 3m35s di `docker`. Su macOS il lock esclude tutte le
  # wheel `nvidia-*` (e' il marcatore di piattaforma di A15 a farlo), cioe' i ~2,5 GB che
  # dominano il download su Linux. Non e' il costo dominante di niente: limitarlo avrebbe
  # solo ritardato la scoperta di una rottura del lock fino al merge su main.
  # ---------------------------------------------------------------------------
  macos-nativo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # La wheel di torch 2.13.0 per Apple Silicon e' `macosx_14_0_arm64`: su un runner
      # piu' vecchio il job fallirebbe per la piattaforma, non per cio' che sta provando —
      # e quel rosso verrebbe letto come "l'installazione su macOS non funziona".
      # Quindi la premessa si verifica PRIMA, e si legge dal log invece che per fede.
      - name: Il runner soddisfa la premessa (arm64, macOS >= 14)
        run: |
          versione=$(sw_vers -productVersion)
          arch=$(uname -m)
          echo "runner: macOS $versione su $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::runner non Apple Silicon ($arch): non e' la piattaforma che questo job prova"
            exit 1
          fi
          if [ "${versione%%.*}" -lt 14 ]; then
            echo "::error::macOS $versione < 14, ma la wheel richiede macosx_14_0"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.14"

      # `--frozen`: se il lock non basta a se stesso su questa piattaforma, deve fallire
      # qui, non risolvere qualcosa di diverso e far passare il job.
      - name: uv sync --frozen (installazione VERA, non un dry-run)
        working-directory: rag
        run: |
          # Il tag di piattaforma dell'INTERPRETE decide se la wheel `macosx_14_0_arm64`
          # di torch e' accettabile: uv puo' usare una CPython gestita con un
          # MACOSX_DEPLOYMENT_TARGET piu' conservativo di quello del runner (e' l'artefatto
          # che A15 aveva incontrato nel dry-run). Stampato PRIMA del sync: se la
          # risoluzione fallisse, il motivo si legge qui invece di doverlo indovinare.
          uv run --no-project python -c "import sysconfig; print('platform tag:', sysconfig.get_platform())"
          uv sync --frozen

      # Importare non basta: una wheel per l'architettura sbagliata importa e poi esplode
      # alla prima operazione. Quindi versione, backend, e un tensore che fa davvero i conti.
      - name: torch importa, dichiara il backend e calcola
        working-directory: rag
        run: |
          uv run python - <<'PY'
          import platform
          import torch
          print("torch      :", torch.__version__)
          print("piattaforma:", platform.machine(), "macOS", platform.mac_ver()[0])
          print("cuda       :", torch.cuda.is_available())
          print("mps        :", torch.backends.mps.is_available(), "(built:", torch.backends.mps.is_built(), ")")
          assert "+cu" not in torch.__version__, f"su macOS torch deve venire da PyPI, non da cu126: {torch.__version__}"
          device = "mps" if torch.backends.mps.is_available() else "cpu"
          x = torch.ones(64, 64, device=device) @ torch.ones(64, 64, device=device)
          print("matmul su  :", device, "->", x.sum().item())
          assert x.sum().item() == 64 ** 3
          PY
