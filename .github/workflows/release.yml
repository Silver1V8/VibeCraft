name: Release

# Su TAG, non su ogni push. Un'immagine per commit brucerebbe storage senza che nessuno la
# usi: cio' che ha senso pubblicare e' una versione che qualcuno puo' citare.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

# GHCR e non Docker Hub: e' lo stesso account del repository, si autentica col GITHUB_TOKEN
# gia' disponibile (nessun segreto da creare e ruotare) e le immagini restano accanto al
# codice. `packages: write` e' il solo permesso in piu' che serve.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # I runner GitHub hanno ~14 GB liberi e l'immagine ne occupa una fetta consistente
      # anche dopo aver escluso la chiusura CUDA. Questi tre alberi non servono a nulla qui
      # e liberano diversi GB: e' la causa piu' probabile di un "no space left on device".
      - name: Libera spazio sul runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      # GHCR accetta SOLO minuscole nel path del pacchetto, e github.repository qui e'
      # "Silver1V8/VibeCraft". metadata-action normalizzerebbe da se', ma dedurlo da un
      # comportamento implicito e' esattamente il genere di cosa che si scopre quando il
      # workflow fallisce: lo si calcola e lo si vede.
      - name: Nome dell'immagine (minuscolo, richiesto da GHCR)
        id: nome
        run: echo "immagine=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login su GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag dell'immagine
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.nome.outputs.immagine }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # SOLO il target `cpu`, ed e' una scelta.
      #  · gira ovunque, GPU o no, quindi e' l'immagine che ha senso distribuire;
      #  · il target `gpu` porta con se' ~4,3 GB di librerie CUDA: pubblicarlo costerebbe
      #    storage e banda a chi lo scarica, e chi ha una GPU ha per definizione la macchina
      #    per costruirselo — `docker build --target gpu -t vibecraft:gpu .`, un comando.
      #
      # Solo linux/amd64. arm64 servirebbe ad Apple Silicon, ma su un runner x86 andrebbe
      # emulato in QEMU: per questo stack (torch, transformers) significa ore, non minuti.
      # Su Apple Silicon la build locale e' nativa e veloce, quindi il rapporto costo/utilita'
      # e' rovesciato. Da riconsiderare se il repository diventa pubblico e quindi ha accesso
      # ai runner ARM gratuiti.
      - name: Costruisci e pubblica (target cpu, linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: cpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min e non max: l'immagine pesa ~2,3 GB e la cache Actions e' 10 GB per
          # repository — esportare anche i layer intermedi la riempirebbe da sola,
          # sfrattando la cache di tutto il resto.
          cache-to: type=gha,mode=min

      - name: Riepilogo
        run: |
          {
            echo "### Immagine pubblicata"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Il repository e' privato, quindi anche il pacchetto GHCR nasce **privato**:"
            echo "per renderlo scaricabile senza credenziali va reso pubblico dalle sue"
            echo "impostazioni su GitHub (Packages -> vibecraft -> Package settings)."
          } >> "$GITHUB_STEP_SUMMARY"
